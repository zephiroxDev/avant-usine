<style>html,body{margin:0;height:100%;background:#0f0d0c;color:#f4ece0;font:16px/1.5 system-ui,sans-serif}body{display:grid;place-items:center}a{color:#e5483b}</style>
<script>
// Entrée du site : la version 26 vit dans /v26/. Les anciennes adresses (#compte, #atelier…) et les liens
// de partage (?share=…) sont traduits vers la bonne page. L'ancien site reste disponible : ancien.html.
(function () {
  var map = {
    '': '/', accueil: '/', ecoute: '/volumes', collection: '/volumes', decouvrir: '/', paroles: '/volumes',
    blindtest: '/communaute/blind-test', communaute: '/communaute', repertoire: '/communaute/chronologie',
    'textes-expliques': '/recherche', historique: '/a-propos/nouveautes', recherche: '/recherche',
    bibliotheque: '/ma-musique', playlists: '/ma-musique/playlists', 'playlist-create': '/ma-musique/playlists', 'playlist-detail': '/ma-musique/playlists',
    local: '/ma-musique/sur-cet-appareil', statistiques: '/ma-musique/mon-annee', 'resume-annuel': '/ma-musique/mon-annee',
    compte: '/compte', reglages: '/compte/reglages', atelier: '/communaute/contribuer', 'gestion-createur': '/compte/studio',
    telechargements: '/a-propos/applications', infos: '/a-propos/guide', soutenir: '/a-propos/soutenir', confidentialite: '/a-propos/confidentialite'
  };
  var h = location.hash.replace(/^#\/?/, '');
  var route = h.charAt(0) === '/' || h.indexOf('/') > 0 ? '/' + h.replace(/^\//, '') : (map[h] || '/');
  location.replace('v26/' + location.search + '#' + route);
})();
</script>
