<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiche 26.0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:#0f0d0c;color:#f4ece0;font:14px system-ui}
body{display:grid;gap:12px;justify-items:center;padding:16px}
canvas{width:min(100%,540px);height:auto;box-shadow:0 10px 40px #000}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<p id="etat">Préparation…</p>
<script>
// Affiche de la version 26.0.2 (Windows 0.11.1) (identité « Nuit de vinyle » : Fraunces + Inter, accent #e5483b).
// draw(t) dessine l'image au temps t (0 → 1 sur la boucle de 6 s). Image fixe = t 0,32 (faisceau bien visible).
const W = 1080, H = 1350;
const C = { bg: '#0f0d0c', ink: '#f4ece0', muted: '#a99f92', faint: '#7b7268', accent: '#e5483b', line: 'rgba(244,236,224,.14)' };
const VERSIONS = [['SITE', '26.0.2'], ['WINDOWS', '0.11.1']];
const POINTS = [
  'L’appli Windows s’ouvre de nouveau',
  '« Mon année » s’ouvre en un instant',
  'Blind Test : le bon temps d’écoute',
  'Atelier : tes synchros enregistrées',
];
const cvs = document.getElementById('c'), g = cvs.getContext('2d');
const covers = [];
const load = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });

function mix(a, b, t) { // couleurs #rrggbb
  const p = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')';
}
function spaced(text, x, y, gap) { // lettres espacées (le canvas ne gère pas letter-spacing partout)
  for (const ch of text) { g.fillText(ch, x, y); x += g.measureText(ch).width + gap; }
  return x;
}
function spacedWidth(text, gap) { let w = 0; for (const ch of text) w += g.measureText(ch).width + gap; return w - gap; }
function rounded(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function draw(t) {
  const wave = (k = 1, ph = 0) => Math.sin((t * k + ph) * Math.PI * 2);
  g.save();
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);

  // Fond : halo rouge chaud qui respire.
  const glow = g.createRadialGradient(W * 0.78, H * 0.18, 40, W * 0.78, H * 0.18, 900);
  glow.addColorStop(0, `rgba(229,72,59,${0.42 + 0.12 * wave()})`);
  glow.addColorStop(0.45, 'rgba(120,28,22,.25)');
  glow.addColorStop(1, 'rgba(15,13,12,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  // Sillons de vinyle (cercles fins) en bas à droite, qui tournent lentement.
  g.save(); g.translate(W * 0.9, H * 0.86); g.rotate(t * Math.PI * 2 * 0.25);
  for (let r = 120; r < 760; r += 14) { g.strokeStyle = `rgba(244,236,224,${r % 56 === 0 ? 0.06 : 0.03})`; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); }
  g.restore();

  // Pochettes en éventail (identité de la collection).
  const base = [[-11, 770, 470], [-2, 880, 420], [8, 985, 490]];
  covers.forEach((img, i) => {
    const [deg, cx, cy] = base[i];
    g.save(); g.translate(cx, cy + 6 * wave(1, i / 3)); g.rotate(((deg + 1.5 * wave(1, i / 3)) * Math.PI) / 180);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 40; g.shadowOffsetY = 20;
    rounded(-105, -105, 210, 210, 11); g.save(); g.clip(); g.drawImage(img, -105, -105, 210, 210); g.restore();
    g.restore();
  });

  // Faisceau de lumière franc qui balaie l'image (animation principale).
  const sweep = -0.35 + ((t * 1.4) % 1.4); // position de -0,35 à 1,05
  g.save(); g.globalCompositeOperation = 'screen';
  g.translate(W * sweep, 0); g.rotate(-0.32);
  const beam = g.createLinearGradient(-170, 0, 170, 0);
  beam.addColorStop(0, 'rgba(255,214,190,0)');
  beam.addColorStop(0.42, 'rgba(255,190,160,.30)');
  beam.addColorStop(0.5, 'rgba(255,236,220,.55)');
  beam.addColorStop(0.58, 'rgba(255,190,160,.30)');
  beam.addColorStop(1, 'rgba(255,214,190,0)');
  g.fillStyle = beam; g.fillRect(-170, -400, 340, H + 900);
  g.restore();

  // Marque.
  g.fillStyle = C.ink; g.font = '600 46px Fraunces';
  g.fillText('Avant l’', 80, 128);
  const bw = g.measureText('Avant l’').width;
  g.fillStyle = mix(C.accent, '#ff8a5c', 0.5 + 0.5 * wave()); g.fillText('usine', 80 + bw, 128);

  // Surtitre.
  g.font = '600 24px Inter'; g.fillStyle = C.accent;
  g.beginPath(); g.arc(88, 222, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = mix('#f0b49c', C.ink, 0.5 + 0.5 * wave(1, 0.25));
  spaced('PATCH 26.0.2 · SITE ET WINDOWS', 110, 231, 5);

  // Titre : léger mouvement + variation douce de couleur, toujours net.
  const lift = 4 * wave();
  g.font = '700 196px Fraunces';
  g.fillStyle = C.ink; g.fillText('Ça', 72, 470 + lift);
  g.font = 'italic 600 196px Fraunces';
  g.save(); g.shadowColor = `rgba(229,72,59,${0.55 + 0.25 * wave()})`; g.shadowBlur = 50;
  g.fillStyle = mix(C.accent, '#ff7a4f', 0.5 + 0.5 * wave(1, 0.5)); g.fillText('repart.', 72, 660 - lift);
  g.restore();

  // Points.
  let y = 800;
  POINTS.forEach((p, i) => {
    g.font = '500 26px Inter'; g.fillStyle = C.accent; g.fillText(String(i + 1).padStart(2, '0'), 80, y);
    g.font = '600 38px Inter'; g.fillStyle = C.ink; g.fillText(p, 142, y + 2 + 1.2 * wave(1, i / 4));
    y += 70;
  });

  // Versions (pastilles) en bas.
  g.font = '600 22px Inter';
  let x = 80, row = 1124;
  VERSIONS.forEach(([n, v], i) => {
    const label = n + ' ' + v, w = spacedWidth(label, 3) + 40;
    if (i === 2) { x = 80; row += 66; } // deux pastilles par ligne, à gauche du grand numéro
    rounded(x, row, w, 50, 10); g.strokeStyle = 'rgba(244,236,224,.28)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = C.ink; spaced(label, x + 20, row + 33, 3); x += w + 14;
  });

  // Grand numéro de version.
  g.font = '700 150px Fraunces'; g.textAlign = 'right';
  g.save(); g.shadowColor = `rgba(229,72,59,${0.5 + 0.3 * wave(1, 0.5)})`; g.shadowBlur = 60;
  g.fillStyle = mix(C.accent, '#ff9a6a', 0.5 + 0.5 * wave(1, 0.75)); g.fillText('26.0.2', W - 70, 1290);
  g.restore(); g.textAlign = 'left';
  g.restore();
}

async function send(name) {
  const blob = await new Promise((ok) => cvs.toBlob(ok, 'image/png'));
  const r = await fetch('/work/refonte-26/affiche/sortie/' + name, { method: 'POST', body: blob });
  if (r.status !== 204) throw Error('Enregistrement refusé : ' + name + ' (' + r.status + ')');
}
/** Exporte l'affiche fixe puis les images de l'animation (6 s à 30 images/s). */
window.exporter = async (frames = 180) => {
  draw(0.32); await send('affiche-26-0-2.png');
  for (let i = 0; i < frames; i++) { draw(i / frames); await send('image-' + String(i).padStart(3, '0') + '.png'); document.getElementById('etat').textContent = 'Image ' + (i + 1) + ' / ' + frames; }
  return 'ok';
};

(async () => {
  await Promise.all(['700 196px Fraunces', 'italic 600 196px Fraunces', '600 46px Fraunces', '600 38px Inter', '500 26px Inter'].map((f) => document.fonts.load(f)));
  for (const n of ['01', '02', '03']) covers.push(await load('../../../cover-' + n + '.webp'));
  let start = performance.now();
  const loop = (now) => { if (!window.pause) draw(((now - start) / 6000) % 1); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  document.getElementById('etat').textContent = 'Prête.';
})();
</script>
</body>
</html>
