<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avant l’usine 26 — 3 identités</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1d1d1f;color:#f2f2f2;font:500 15px/1.5 system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:#111;border-bottom:1px solid #333}
.bar strong{margin-right:auto}
.bar button{font:inherit;color:#f2f2f2;background:#2a2a2c;border:1px solid #444;border-radius:999px;padding:8px 16px;cursor:pointer}
.bar button[aria-pressed=true]{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.desc{padding:12px 16px 0;color:#bbb;max-width:70em}
.desc b{color:#fff}
.grid{display:grid;gap:24px;padding:16px;grid-template-columns:1fr}
.label{font-size:13px;color:#999;margin:0 0 8px}
.desk{position:relative;width:100%;aspect-ratio:1280/800;overflow:hidden;border-radius:10px;border:1px solid #333;background:#000}
.desk iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0}
.phones{display:flex;flex-wrap:wrap;gap:24px}
.phone{width:390px;max-width:100%;height:780px;border:10px solid #000;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #444}
.phone iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="bar">
  <strong>Avant l’usine 26 — choisis une identité</strong>
  <button data-t="a" aria-pressed="true">A · Nuit de vinyle</button>
  <button data-t="b" aria-pressed="false">B · Plein soleil</button>
  <button data-t="c" aria-pressed="false">C · Port de nuit</button>
</div>
<p class="desc" id="desc"></p>
<div class="grid">
  <div><p class="label">Ordinateur (1280 × 800, réduit pour tenir ici)</p><div class="desk"><iframe id="d" title="Ordinateur"></iframe></div></div>
  <div><p class="label">Téléphone : accueil puis lecteur (390 px de large)</p>
    <div class="phones"><div class="phone"><iframe id="p1" title="Téléphone accueil"></iframe></div><div class="phone"><iframe id="p2" title="Téléphone lecteur"></iframe></div></div>
  </div>
</div>
<script>
const texts={
 a:'<b>Nuit de vinyle</b> : sombre et chaleureux, comme une pochette de disque. Titres en Fraunces (une police à empattements élégante), accent rouge, pochettes légèrement inclinées.',
 b:'<b>Plein soleil</b> : clair et franc, inspiré de Marseille en plein jour. Titres larges en Archivo, bleu outremer et jaune soleil, contours noirs nets, aucune ombre.',
 c:'<b>Port de nuit</b> : bleu nuit avec des reflets turquoise et corail, coins arrondis, panneaux translucides. Titres en Unbounded, texte en Manrope.'
};
const d=document.getElementById('d'),p1=document.getElementById('p1'),p2=document.getElementById('p2');
function fit(){const w=d.parentElement.clientWidth;d.style.transform='scale('+(w/1280)+')';}
function show(t){d.src='ecran.html?theme='+t;p1.src='ecran.html?theme='+t;p2.src='ecran.html?theme='+t+'&vue=lecteur';
 document.getElementById('desc').innerHTML=texts[t];document.querySelectorAll('.bar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));}
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>show(b.dataset.t));
addEventListener('resize',fit);fit();show('a');
</script>
</body>
</html>
