<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hypno Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@500;700&display=swap">
<style>
  /* Layout: the arena fills the screen like a vertical video; a compact control deck sits under it and disappears in recording mode. */
  :root {
    color-scheme: dark;
    --bg: #0d0b1e;
    --deck: #1a1733;
    --edge: #322d5c;
    --ink: #f1eeff;
    --ink-soft: #a7a2cc;
    --accent: #ff5fa8;
    --accent-ink: #1b0a14;
    --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    box-sizing: border-box;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .deck { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 15px; margin: 0; letter-spacing: .02em; }
  .status { font-size: 13px; color: var(--ink-soft); flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  button, .file {
    font: inherit; font-weight: 700; font-size: 14px;
    color: var(--ink); background: var(--deck);
    border: 0; box-shadow: inset 0 0 0 1px var(--edge);
    border-radius: 12px; padding: 10px 12px; cursor: pointer;
    flex: 1 1 auto; text-align: center;
  }
  .file { position: relative; }
  .file input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .file:focus-within, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.main { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  button:active, .file:active { transform: scale(.97); }
  button:disabled, input:disabled { opacity: .4; }
  .sliders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sliders label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; min-width: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 24px; }
  .inst label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  select { font: inherit; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 12px; padding: 9px 10px; flex: 1; }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* ---- app shell: home menu ---- */
  .home { height: 100%; max-width: 560px; margin: 0 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding-block: 18px; box-sizing: border-box; }
  .brand { display: flex; flex-direction: column; gap: 8px; }
  .brand .name { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 52px); line-height: 1; letter-spacing: -.01em; margin: 0; }
  .brand .name b { color: var(--accent); font-weight: 800; }
  .brand p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.45; max-width: 34ch; }
  .shelf-label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 0; }
  .shelf { display: flex; flex-direction: column; gap: 12px; }
  .game {
    display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; text-align: left;
    background: var(--deck); border-radius: 20px; padding: 12px; box-shadow: inset 0 0 0 1px var(--edge); flex: none;
    color: var(--ink); font-weight: 500; font-size: 14px;
  }
  .game > div { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .game .gname { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; }
  .game .gdesc { color: var(--ink-soft); line-height: 1.35; }
  .game .go { align-self: flex-start; margin-top: 3px; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 99px; padding: 6px 16px; }
  .game.soon { background: none; box-shadow: none; border: 1.5px dashed var(--edge); cursor: default; }
  .game.soon .gname { color: var(--ink-soft); }
  .thumb { width: 92px; height: 92px; border-radius: 16px; background: var(--bg); position: relative; overflow: hidden; }
  .thumb.ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 14px var(--accent); animation: tint 6s linear infinite; }
  .thumb.ring::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); left: 39px; top: 39px; animation: hop 1.7s ease-in-out infinite alternate, hopx 2.3s ease-in-out infinite alternate; }
  .thumb.empty::before { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; color: var(--edge); }
  @keyframes hop { from { top: 20px; } to { top: 58px; } }
  @keyframes hopx { from { left: 22px; } to { left: 56px; } }
  @keyframes tint { to { filter: hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .thumb.ring::before, .thumb.ring::after { animation: none; } }
  .back { flex: 0 0 auto; padding: 7px 12px; }
  .more { display: flex; flex-direction: column; gap: 10px; }
  .sliders.one { grid-template-columns: 1fr; }
  .sliders.two { grid-template-columns: 1fr 1fr; }
  .file span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 44vw; }
  .sheet { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 94%, transparent); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 16px; }
  .sheet-head button { flex: 0 0 auto; }
  .sheet-tip { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .sheet > button { flex: none; }
  .racers { display: flex; flex-direction: column; gap: 8px; }
  .racer { display: grid; grid-template-columns: 50px 1fr 42px; gap: 8px; align-items: center; }
  .pic { width: 46px; height: 46px; box-sizing: border-box; border-radius: 50%; border: 3px solid hsl(var(--h) 92% 62%); background: var(--deck) center / cover; position: relative; overflow: hidden; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .pic input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .pic:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text] { font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
  input[type=text]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .del { padding: 8px 0; font-size: 18px; line-height: 1; }
  .winrow { display: flex; flex-direction: column; gap: 6px; }
  .racer-more { grid-column: 1 / -1; display: grid; grid-template-columns: 44px 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .racer-more input[type=color] { width: 44px; height: 38px; padding: 0; border: 0; border-radius: 10px; background: none; }
  .racer-more select { padding: 7px 8px; font-size: 13px; }
  .team { padding: 7px 8px; font-size: 12px; }
  .team.t0 { box-shadow: inset 0 0 0 2px #ff5fa8; } .team.t1 { box-shadow: inset 0 0 0 2px #6fd8ff; }
  .sheet-h { margin: 6px 0 0; font-family: var(--font-display); font-size: 13px; }
  .cfg.grp { grid-template-columns: 1fr 40px; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .stepline { display: grid; grid-template-columns: 58px 1fr 1fr 58px 36px; gap: 5px; align-items: end; }
  .stepf { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stepf span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .stepf select, .stepf input { min-width: 0; width: 100%; box-sizing: border-box; padding: 7px 6px; font-size: 13px; }
  input[type=number] { font: inherit; font-weight: 700; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 10px; }
  .stepline .ic { padding: 8px 0; }
  .winrow span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  canvas.thumb { position: static; width: 92px; height: 92px; }
  body.rec { padding: 0; }
  body.rec .deck { display: none; }
  body.rec .app { max-width: none; gap: 0; }
  body.rec .stage { border-radius: 0; box-shadow: none; }
  .hook { display: flex; flex-direction: column; gap: 6px; }
  .hook span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .export { position: fixed; inset: 0; z-index: 10; background: rgba(8,6,20,.82); display: grid; place-items: center; padding: 16px; }
  .export-card { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--deck); border-radius: 20px; padding: 14px; box-shadow: inset 0 0 0 1px var(--edge); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
  .export video { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 14px; background: var(--bg); }
  .export-title { margin: 0; font-family: var(--font-display); font-size: 15px; }
  .export-msg { margin: 0; min-height: 1.2em; color: var(--ink-soft); font-size: 13px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  .tab { flex: 0 0 auto; padding: 8px 12px; font-size: 13px; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
  .tab-body, .tab-pane { display: flex; flex-direction: column; gap: 10px; }
  .cfg-list { display: flex; flex-direction: column; gap: 6px; }
  .cfg { display: grid; grid-template-columns: 40px 1fr 40px 52px; gap: 6px; align-items: center; }
  .cfg .ic { padding: 8px 0; font-size: 16px; }
  .cfg .ic.danger { background: #ff4d6a; color: #1b0a14; font-size: 12px; }
  .cfg-name { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gamepane h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 13px; }
  .stats { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .stats th, .stats td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--edge); }
  .stats th:first-child, .stats td:first-child { text-align: left; }
  .stats-wrap { overflow-x: auto; }
  .cine-hint { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: rgba(13,11,30,.82); color: var(--ink); padding: 10px 14px; border-radius: 99px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cine-hint.show { opacity: 1; }
  .err-toast { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); background: #3a1530; max-width: 86vw; text-align: center; }
  .hist { display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow-y: auto; font-size: 13px; }
  .hist p { margin: 0; line-height: 1.35; } .hist span { display: block; color: var(--ink-soft); font-size: 11px; }
  .hist-btn { align-self: flex-start; flex: none; }
  @media (max-height: 620px) { .sliders label span { display: none; } }
</style>

<main class="home" id="home">
  <div class="brand">
    <h1 class="name">Hypno<b>Box</b></h1>
    <p>Des jeux à regarder autant qu'à jouer, pensés pour l'écran vertical.</p>
  </div>
  <button type="button" id="hist-btn" class="hist-btn">Historique et statistiques</button>
  <label class="hook"><span>Texte d'accroche de tes vidéos</span><input type="text" id="caption" maxlength="60" placeholder="Ex. : Attends la fin…" autocomplete="off"></label>
  <p class="shelf-label">Jeux</p>
  <div class="shelf">
    <div class="game soon">
      <span class="thumb empty"></span>
      <div>
        <span class="gname">Prochain jeu</span>
        <span class="gdesc">Tes nouveaux jeux s'ajouteront ici.</span>
      </div>
    </div>
  </div>
</main>

<script>
/* Shared tools for every game: the hook text drawn on top of the video, and the built-in video export
   (canvas + game sound recorded together, then offered as a file). */
window.HBX = (() => {
  let caption = '';
  try { caption = localStorage.getItem('hypno.caption') || ''; } catch (e) {}
  const dlP = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  function lines(g, text, maxW) {
    const words = text.split(/\s+/), out = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    if (cur) out.push(cur); return out.slice(0, 3);
  }
  const st = Object.assign({ size: 1, pos: 'haut', color: '#ffffff', hide: false, dur: 0, cd: 3, loop: false }, (() => { try { return JSON.parse(localStorage.getItem('hypno.studio') || '{}'); } catch (e) { return {}; } })());
  const saveSt = () => { try { localStorage.setItem('hypno.studio', JSON.stringify(st)); } catch (e) {} };
  function drawCaption(g, W, H) {
    if (!caption || st.hide) return;
    const fs = Math.round(Math.min(W * 0.068, H * 0.04, 36) * st.size);
    g.save(); g.textAlign = 'center'; g.textBaseline = 'top'; g.font = '800 ' + fs + 'px "Unbounded", system-ui, sans-serif';
    g.lineJoin = 'round'; g.lineWidth = fs * 0.28; g.strokeStyle = st.color === '#0d0b1e' ? 'rgba(255,255,255,.92)' : 'rgba(13,11,30,.9)'; g.fillStyle = st.color; g.shadowBlur = 0;
    const ls = lines(g, caption, W * 0.86), y0 = st.pos === 'milieu' ? H * 0.46 - ls.length * fs * 0.61 : st.pos === 'bas' ? H * 0.9 - ls.length * fs * 1.22 : H * 0.055;
    ls.forEach((l, i) => { const y = y0 + i * fs * 1.22; g.strokeText(l, W / 2, y); g.fillText(l, W / 2, y); });
    g.restore();
  }
  let rec = null;
  function pickType() {
    if (!window.MediaRecorder) return null;
    for (const t of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'])
      if (MediaRecorder.isTypeSupported(t)) return t;
    return null;
  }
  function startRec(canvas, ac, master, name) {
    stopRec(true);
    const type = pickType(); if (!type || !canvas.captureStream) return false;
    try {
      const stream = canvas.captureStream(60); let dest = null;
      if (ac && master && ac.createMediaStreamDestination) { dest = ac.createMediaStreamDestination(); master.connect(dest); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t)); }
      const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 }), chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec = { mr, chunks, dest, master, type, name, t0: performance.now(), stream };
      mr.start(500); return true;
    } catch (e) { rec = null; return false; }
  }
  function stopRec(silent) {
    const r = rec; rec = null; if (!r) return;
    r.mr.onstop = () => {
      try { if (r.dest) r.master.disconnect(r.dest); } catch (e) {}
      r.stream.getTracks().forEach(t => t.stop());
      if (silent || !r.chunks.length) return;
      sheet(new Blob(r.chunks, { type: r.type.split(';')[0] }), r.type.includes('mp4') ? 'mp4' : 'webm', (performance.now() - r.t0) / 1000, r.name);
    };
    try { r.mr.stop(); } catch (e) {}
  }
  function sheet(blob, ext, secs, name) {
    const url = URL.createObjectURL(blob), box = document.createElement('div'); box.className = 'export';
    box.innerHTML = '<div class="export-card" role="dialog" aria-label="Vidéo prête"><video playsinline loop muted autoplay></video>' +
      '<p class="export-title">Ta vidéo est prête · ' + Math.round(secs) + ' s</p><p class="export-msg" aria-live="polite"></p>' +
      '<div class="row"><button class="main" type="button" data-save>Enregistrer la vidéo</button><button type="button" data-close>Fermer</button></div></div>';
    const v = box.querySelector('video'), msg = box.querySelector('.export-msg'); v.src = url;
    v.addEventListener('click', () => { v.muted = !v.muted; });
    document.body.appendChild(box);
    const close = () => { URL.revokeObjectURL(url); box.remove(); };
    box.querySelector('[data-close]').addEventListener('click', close);
    box.querySelector('[data-save]').addEventListener('click', async e => {
      const btn = e.currentTarget, file = 'hypnobox-' + name + '-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.' + ext;
      btn.disabled = true; msg.textContent = '';
      const dl = await Promise.race([dlP, new Promise(ok => setTimeout(() => ok(null), 1500))]);
      try {
        if (dl) { await dl.save({ filename: file, data: blob }); msg.textContent = 'Vidéo enregistrée.'; }
        else { const a = document.createElement('a'); a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove(); msg.textContent = 'Téléchargement lancé.'; }
      } catch (err) {
        msg.textContent = err && err.code === 'declined' ? 'Enregistrement annulé.' : 'Impossible d\'enregistrer ici. Réessaie dans un instant.';
      }
      btn.disabled = false;
    });
  }
  return {
    get caption() { return caption; },
    setCaption(t) { caption = t.trim().slice(0, 60); try { localStorage.setItem('hypno.caption', caption); } catch (e) {} },
    drawCaption, startRec, stopRec, canRecord: () => !!pickType(),
    studio: st, saveStudio: saveSt, get recording() { return !!rec; },
    due() { return !!rec && st.dur > 0 && !st.loop && (performance.now() - rec.t0) / 1000 >= st.dur; }   // planned length reached
  };
})();
</script>
<script>
/* History of games and problems met, for every game. Errors are shown briefly and kept, so a crash can be traced. */
window.HBH = (() => {
  const K = 'hypno.history', KE = 'hypno.errors';
  const rd = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
  const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  function add(game, text) { const l = rd(K); l.unshift({ t: Date.now(), g: game, x: text }); wr(K, l.slice(0, 150)); }
  const seen = new Set(), toast = document.createElement('div'); toast.className = 'cine-hint err-toast'; document.body.appendChild(toast);
  function err(m) {
    m = String(m || 'erreur inconnue').slice(0, 160); const l = rd(KE); l.unshift({ t: Date.now(), x: m }); wr(KE, l.slice(0, 30));
    if (seen.has(m)) return; seen.add(m);
    toast.textContent = 'Un problème est survenu. Le jeu continue, et l\'erreur est notée dans l\'historique.'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 4000);
  }
  window.addEventListener('error', e => err((e.message || 'erreur') + (e.lineno ? ' (ligne ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => err(e.reason && (e.reason.message || e.reason)));
  const fmt = t => { const d = new Date(t); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
  function open() {
    const box = document.createElement('div'); box.className = 'export';
    const l = rd(K), errs = rd(KE), games = {};
    for (const e of l) { games[e.g] = games[e.g] || { n: 0, last: e }; games[e.g].n++; }
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    box.innerHTML = '<div class="export-card" role="dialog" aria-label="Historique"><p class="export-title">Historique et statistiques</p>' +
      (Object.keys(games).length ? '<div class="stats-wrap"><table class="stats"><thead><tr><th>Jeu</th><th>Parties</th><th>Dernière</th></tr></thead><tbody>' + Object.entries(games).map(([g, v]) => '<tr><td>' + esc(g) + '</td><td>' + v.n + '</td><td>' + fmt(v.last.t) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="sheet-tip">Pas encore de partie terminée.</p>') +
      '<div class="hist">' + l.slice(0, 60).map(e => '<p><span>' + fmt(e.t) + ' · ' + esc(e.g) + '</span>' + esc(e.x) + '</p>').join('') + '</div>' +

/* Look shared by every game: themes, glow, particle amount, quality level, reduced motion, cinema and full screen.

window.HBT = (() => {
  const Q = { eco: { dpr: 1, bloom: 0, parts: 0.5 }, bal: { dpr: 1.5, bloom: 1, parts: 1 }, ultra: { dpr: 2, bloom: 1.4, parts: 1.6 } };
  let autoLvl = 'bal', slowFor = 0, fastFor = 0;
  const lv = () => Q[s.quality === 'auto' ? autoLvl : s.quality];
  const THEMES = [['neon', 'Néon (d\'origine)'], ['minimal', 'Minimaliste'], ['futur', 'Futuriste'], ['sombre', 'Sombre'], ['lumineux', 'Lumineux'],

  let s = { theme: 'neon', glow: 0.5, parts: 1, quality: 'bal', motion: 'auto' };

      const mkB = (k, o) => { const w = Math.max(4, Math.round(W / k)), h = Math.max(4, Math.round(H / k)); if (!o) { const cv0 = cnv(w, h); o = { c: cv0, x: cv0.getContext('2d') }; } if (o.c.width !== w || o.c.height !== h) { o.c.width = w; o.c.height = h; } return o; };

    else if (th === 'futur') {

      else { gr = g.createLinearGradient(0, 0, W, H); for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, 'hsl(' + ((i * 60 + t * 40) % 360) + ' 100% 55%)'); }

    else if (th === 'retro') {
      fill('color', '#ff9a3c', 0.45);

      if (!grain) { grain = cnv(96, 96); const x = grain.getContext('2d'), d = x.createImageData(96, 96); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); }

  function attach(view) {

      '<label class="winrow" for="' + id + '-th"><span>Thème visuel</span><select id="' + id + '-th" data-th data-nocfg>' + THEMES.map(([v, l]) => '<option value="' + v + '">' + l + '</option>').join('') + '</select></label>' +
      '<label class="winrow" for="' + id + '-gl"><span>Lueur (intensité des effets lumineux)</span><input type="range" id="' + id + '-gl" data-gl data-nocfg min="0" max="1.5" step="0.05"></label>' +
      '<label class="winrow" for="' + id + '-pa"><span>Quantité de particules</span><input type="range" id="' + id + '-pa" data-pa data-nocfg min="0.2" max="2" step="0.05"></label>' +

/* Saved configurations, per game: every slider, list and on/off button of the game (not the shared music or look)
   is captured under a name. Also: favourites, rename, delete, defaults, random, and the last one used (saved automatically). */
window.HBC = (() => {
  const key = g => 'hypno.cfg.' + g;
  const read = g => { try { return JSON.parse(localStorage.getItem(key(g)) || '{"list":[],"last":null}'); } catch (e) { return { list: [], last: null }; } };
  const write = (g, d) => { try { localStorage.setItem(key(g), JSON.stringify(d)); return true; } catch (e) { return false; } };
  const ctrls = view => Array.from(view.querySelectorAll('input[type=range][id], select[id], button[aria-pressed][id]')).filter(e => !e.closest('[data-nocfg]') && !e.hasAttribute('data-nocfg'));
  function capture(view) { const v = {}; for (const e of ctrls(view)) v[e.id] = e.tagName === 'BUTTON' ? e.getAttribute('aria-pressed') : e.value; return v; }
  function apply(view, vals) {
    for (const [id, val] of Object.entries(vals || {})) {
      const e = view.querySelector('#' + CSS.escape(id)); if (!e) continue;
      if (e.tagName === 'BUTTON') { if (e.getAttribute('aria-pressed') !== val && !e.disabled) e.click(); continue; }
      if (e.value === String(val)) continue;
      e.value = val; e.dispatchEvent(new Event('input', { bubbles: true })); e.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
  function random(view) {
    const v = {};
    for (const e of ctrls(view)) {
      if (e.hasAttribute('data-norand')) continue;
      if (e.tagName === 'BUTTON') v[e.id] = Math.random() < 0.5 ? 'true' : 'false';
      else if (e.tagName === 'SELECT') v[e.id] = e.options[Math.floor(Math.random() * e.options.length)].value;
      else { const mn = +e.min, mx = +e.max, st = +e.step || 0.01; v[e.id] = String(Math.round((mn + Math.random() * (mx - mn)) / st) * st); }
    }
    apply(view, v);
  }
  function attach(view, game) {
    let defaults = null, timer = 0, confirmDel = -1, renaming = -1;
    const nd = document.createElement('div'); nd.className = 'tab-pane';
    nd.innerHTML = '<div class="row"><input type="text" id="' + view.id + '-cfgname" maxlength="30" placeholder="Nom de la configuration" aria-label="Nom de la configuration" data-nocfg><button class="main" type="button" data-save>Enregistrer</button></div>' +
      '<div class="cfg-list" data-list></div>' +
      '<div class="row"><button type="button" data-last>Reprendre la dernière</button><button type="button" data-def>Par défaut</button><button type="button" data-rnd>Aléatoire</button></div>' +
      '<p class="sheet-tip" data-msg aria-live="polite">Une configuration garde tous les réglages de ce jeu. La dernière utilisée est gardée automatiquement.</p>';
    const list = nd.querySelector('[data-list]'), msg = nd.querySelector('[data-msg]'), name = nd.querySelector('input');
    const say = t => { msg.textContent = t; };
    function render() {
      const d = read(game); list.textContent = '';
      if (!d.list.length) { const p = document.createElement('p'); p.className = 'sheet-tip'; p.textContent = 'Aucune configuration enregistrée pour ce jeu.'; list.appendChild(p); return; }
      d.list.map((c, i) => ({ c, i })).sort((a, b) => (b.c.fav ? 1 : 0) - (a.c.fav ? 1 : 0)).forEach(({ c, i }) => {
        const line = document.createElement('div'); line.className = 'cfg';
        const fav = document.createElement('button'); fav.type = 'button'; fav.className = 'ic'; fav.textContent = c.fav ? '★' : '☆'; fav.setAttribute('aria-label', c.fav ? 'Retirer des favoris' : 'Mettre en favori'); fav.setAttribute('aria-pressed', String(!!c.fav)); fav.dataset.nocfg = '';
        let main;

          main.addEventListener('keydown', e => { if (e.key === 'Enter') done(); }); main.addEventListener('blur', done); }

        const del = document.createElement('button'); del.type = 'button'; del.className = 'ic' + (confirmDel === i ? ' danger' : ''); del.textContent = confirmDel === i ? 'Sûr ?' : '×'; del.setAttribute('aria-label', 'Supprimer');

    });
    nd.querySelector('[data-last]').addEventListener('click', () => { const d = read(game); if (d.last) { apply(view, d.last); say('Dernière configuration reprise.'); } else say('Pas encore de dernière configuration pour ce jeu.'); });
    nd.querySelector('[data-def]').addEventListener('click', () => { apply(view, defaults); say('Paramètres par défaut remis.'); });
    nd.querySelector('[data-rnd]').addEventListener('click', () => { random(view); say('Configuration tirée au hasard.'); });
    const remember = () => { clearTimeout(timer); timer = setTimeout(() => { const d = read(game); d.last = capture(view); write(game, d); }, 600); };
    view.addEventListener('input', e => { if (!e.target.closest('[data-nocfg]') && !e.target.hasAttribute('data-nocfg')) remember(); });
    view.addEventListener('change', e => { if (!e.target.closest('[data-nocfg]') && !e.target.hasAttribute('data-nocfg')) remember(); });
    view.addEventListener('click', e => { if (e.target.closest('button[aria-pressed][id]')) remember(); });

  }
  return { attach, capture, apply, random, list: g => read(g).list };
})();

<script>
/* Video studio, shared by every game: length, countdown, hook text style, video presets, perfect loop and

/* Scenario editor, per game: timed steps that change any slider or list of the game (or the look), instantly or

<script>
/* Jeu 2 · Éventail : quatre pales entourent le moyeu ; les billes sont poussées vers le bord. Les ouvertures

  function reset(c) {
    const cap = c.thumb ? 260 : Math.round(c.opt.max || 2000);

    for (let j = 0; j < q.m; j++) {

      P.add(p, Math.cos(ang) * rho, Math.sin(ang) * rho, 0, 0, q.g, 0);
    }
    c.note(c.scale(5 + q.g % 9), 1, 1.4);
  }
  // keep every ball in a gap: an angular wedge around 0°, 90°, 180° or 270°
  function blades(st) {
    const p = st.p, r = st.r, X = p.X, Y = p.Y;
    for (let i = 0; i < p.n; i++) {
      const rho = Math.hypot(X[i], Y[i]); if (rho < HUB) continue;
      const phi = Math.atan2(Y[i], X[i]), q = Math.round(phi / (Math.PI / 2)), c0 = q * Math.PI / 2, hw = (q & 1) ? st.hv : st.hh;
      const d = P.wrap(phi - c0), lim = hw - Math.asin(Math.min(1, r / rho));
      if (Math.abs(d) <= lim) continue;
      const nd = lim > 0 ? Math.sign(d) * lim : 0, a = c0 + nd;
      X[i] = Math.cos(a) * rho; Y[i] = Math.sin(a) * rho;
    }
  }

    const st = c.st; if (!st) return; st.t += dt;
    st.pt += dt; const nm = PH[st.ph][0];
    if (st.pt >= PH[st.ph][1]) {
      st.pt = 0;

      if (nm === 'hold') release(c, st);
      st.ph = (st.ph + 1) % PH.length; if (st.ph === 0) st.pair = 1 - st.pair;
    }

    const rT = Math.max(st.rmin, Math.min(0.03, Math.sqrt(0.2 / Math.max(1, st.p.n))));
    st.r += (rT - st.r) * Math.min(1, dt * 1.5);
    const sub = 2, h = dt / sub, g0 = 2.4 * (c.react ? 1 + c.react.beat * 0.5 : 1);
    for (let s = 0; s < sub; s++) {
      P.integrate(st.p, h, 0.5, (x, y) => { const d = Math.hypot(x, y) || 1; return [x / d * g0, y / d * g0]; }, 3);
      for (let it = 0; it < 3; it++) { P.collide(st.p, st.r, -1.05, -1.05, 2.1, 2.1); blades(st); P.inCircle(st.p, 1, st.r, 0.2); }
    }
    for (const f of st.flash) f.t += dt; st.flash = st.flash.filter(f => f.t < 0.7);
    if (st.rounds >= 2 || st.end) {
      if (P.ending(c, st, dt, 'Éventail', 'Éventail rempli : ' + st.p.n + ' billes, ' + (st.gen + 1) + ' couleurs en ' + Math.round(st.t) + ' s', 3)) reset(c);
    }
    if (!c.thumb) c.status(st.p.n + ' billes · ' + (st.gen + 1) + (st.gen ? ' couleurs' : ' couleur'));
  }

  function draw(c, g) {
    const st = c.st; if (!st) return;
    const R = Math.min(c.W * 0.44, c.H * 0.38), ox = c.W / 2, oy = c.H / 2, beat = c.react ? c.react.beat : 0;
    g.fillStyle = '#100c26'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.fill();
    P.drawBalls(g, st.p, ox, oy, R, st.r);
    // the four blades: wedges between the gaps
    for (let q = 0; q < 4; q++) {
      const a0 = q * Math.PI / 2 + (q & 1 ? st.hv : st.hh), a1 = (q + 1) * Math.PI / 2 - ((q + 1) & 1 ? st.hv : st.hh);
      if (a1 - a0 < 0.002) continue;
      g.fillStyle = '#4f4a78'; g.strokeStyle = '#2f2a52'; g.lineWidth = Math.max(1, R * 0.006);
      g.beginPath(); g.moveTo(ox, oy); g.arc(ox, oy, R, a0, a1); g.closePath(); g.fill(); g.stroke();
      const am = (a0 + a1) / 2, sw = (a1 - a0) / 2;
      g.strokeStyle = '#3a355f'; g.lineWidth = Math.max(1.5, R * 0.014); g.lineCap = 'round';
      for (const [rr, off] of [[0.42, 0.32], [0.72, -0.32]]) { const aa = am + off * sw; g.beginPath(); g.moveTo(ox + Math.cos(aa) * R * (rr - 0.06), oy + Math.sin(aa) * R * (rr - 0.06)); g.lineTo(ox + Math.cos(aa) * R * (rr + 0.06), oy + Math.sin(aa) * R * (rr + 0.06)); g.stroke(); }
    }
    for (const f of st.flash) {
      const k = f.t / 0.7; g.strokeStyle = 'rgba(255,255,255,' + (0.9 * (1 - k)).toFixed(3) + ')'; g.lineWidth = Math.max(2, R * 0.02 * (1 - k));
      g.beginPath(); for (const s of [1, -1]) { if (f.pair === 0) { g.moveTo(ox, oy + s * R * HUB); g.lineTo(ox, oy + s * R); } else { g.moveTo(ox + s * R * HUB, oy); g.lineTo(ox + s * R, oy); } } g.stroke();
    }
    g.lineWidth = Math.max(1.5, R * 0.009) * (1 + beat * 0.8); g.strokeStyle = 'rgba(214,206,255,.85)'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.stroke();
    g.fillStyle = '#9d97c4'; g.beginPath(); g.arc(ox, oy, R * HUB * (1 + beat * 0.2), 0, 7); g.fill();
    g.fillStyle = '#4a4470'; g.beginPath(); g.arc(ox, oy, R * HUB * 0.45, 0, 7); g.fill();
    P.fade(g, c, st, 3);
  }

  HB.game({
    id: 'eventail', name: 'Éventail',
    desc: 'Quatre pales s\'ouvrent et se ferment tour à tour : les billes écrasées renaissent multipliées, d\'une nouvelle couleur.',
    ranges: [
      { key: 'mult', label: 'Multiplier', min: 2, max: 6, step: 1, value: 3 },
      { key: 'max', label: 'Billes', min: 500, max: 3500, step: 100, value: 2000, restart: true }
    ],
    thumbSteps: 300, reset, step, draw
  });
})();

<script>
/* Jeu 3 · Mâchoires : deux mâchoires en dents de scie s'ouvrent (les billes tombent et s'entassent), puis se
   referment jusqu'à être bloquées par les billes, qu'elles tassent dans un couloir en zigzag. Chaque fermeture
   ajoute une nouvelle fournée ; quand le zigzag déborde jusqu'en haut, c'est plein. */
(() => {
  const P = HBP, A = 0.15, HALF = 0.11, SLOPE = Math.sqrt(1 + Math.pow(A / HALF, 2));
  const tri = y => { const u = y / HALF, m = ((u % 2) + 2) % 2; return Math.abs(m - 1); };
  const T = y => A * tri(y);

  function reset(c) {
    const cap = c.thumb ? 200 : 1800;
    const st = c.st = { p: P.pool(cap), r: c.thumb ? 0.03 : 0.0165 * (c.opt.size || 1), s: 1.1 + A, ph: 'open', pt: 0, gen: 0, t: 0, full: false, blocked: 0, pen: 0, end: 0, shake: 0 };
    for (let i = 0; i < 16; i++) P.add(st.p, (Math.random() - 0.5) * 0.6, -0.5 + Math.random() * 0.3, 0, 0, 0, 1);
  }
  function jaws(st) {
    const p = st.p, X = p.X, Y = p.Y, r = st.r * SLOPE; let pen = 0;
    for (let i = 0; i < p.n; i++) {
      const t = T(Y[i]), eL = -st.s + t, eR = st.s - A + t;
      if (X[i] < eL + r) { pen = Math.max(pen, eL + r - X[i]); X[i] = eL + r; }
      if (X[i] > eR - r) { pen = Math.max(pen, X[i] - eR + r); X[i] = eR - r; }
    }
    st.pen = Math.max(st.pen, pen);
  }
  function batch(c, st) {
    const p = st.p, grow = c.opt.grow || 0.6, m = Math.min(p.cap - p.n, Math.max(4, Math.round(p.n * grow))), g = ++st.gen;
    for (let j = 0; j < m; j++) P.add(p, (Math.random() - 0.5) * 1.1, -0.75 + Math.random() * 0.35 - (j / m) * 0.2, (Math.random() - 0.5) * 0.004, 0, g, 0.6);
    c.note(c.scale(4 + g % 8), 1, 1.3);
  }
  function step(c, dt) {
    const st = c.st; if (!st) return; st.t += dt; st.pt += dt;
    const open = 1.1 + A, smin = A / 2 + 0.004;
    if (st.ph === 'open') { st.s = Math.min(open, st.s + dt * 1.1); if (st.pt > 2.4 && !st.full) { st.ph = 'close'; st.pt = 0; st.blocked = 0; } }
    else if (st.ph === 'close') {
      if (st.pen < st.r * 0.55) st.s = Math.max(smin, st.s - dt * 0.75); else { st.blocked += dt; st.s += dt * 0.04; }
      if (st.s <= smin + 1e-4 || st.blocked > 0.45) {
        st.ph = 'hold'; st.pt = 0; st.shake = 0.25; c.note(c.scale(1 + st.gen % 8), 0.9, 0.8);
        let top = 0; for (let i = 0; i < st.p.n; i++) if (st.p.Y[i] < -0.8) top++;
        if (top > 4 || st.p.n >= st.p.cap * 0.97) st.full = true;
      }
    } else if (st.ph === 'hold') { if (st.pt > 0.7) { if (st.full) { st.ph = 'done'; } else { st.ph = 'open'; st.pt = 0; batch(c, st); } } }
    st.pen = 0; st.shake = Math.max(0, st.shake - dt);
    const sub = 3, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      P.integrate(st.p, h, 0.6, () => [0, 3.2], 4);
      for (let it = 0; it < 3; it++) { P.collide(st.p, st.r, -1.05, -1.05, 2.1, 2.1); jaws(st); P.inCircle(st.p, 1, st.r, 0.15); }
    }
    if (st.ph === 'done' && P.ending(c, st, dt, 'Mâchoires', 'Plein : ' + st.p.n + ' billes en ' + Math.round(st.t) + ' s', 3.5)) reset(c);
    if (!c.thumb) c.status(st.p.n + ' billes' + (st.full ? ' · plein !' : ''));
  }

  function draw(c, g) {
    const st = c.st; if (!st) return;
    const R = Math.min(c.W * 0.44, c.H * 0.36), sh = st.shake > 0 ? (Math.random() - 0.5) * R * 0.02 * st.shake * 4 : 0, ox = c.W / 2 + sh, oy = c.H * 0.47, beat = c.react ? c.react.beat : 0;
    g.fillStyle = '#100c26'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.fill();
    P.drawBalls(g, st.p, ox, oy, R, st.r);
    g.save(); g.beginPath(); g.arc(ox, oy, R, 0, 7); g.clip();

      g.fillStyle = '#35305c'; g.fill(); g.strokeStyle = '#a49ecb'; g.lineWidth = Math.max(1, R * 0.006); g.stroke();
      // rail and rivets on each jaw
      const rail = side < 0 ? -st.s - 0.06 : st.s + 0.06 - A; g.strokeStyle = 'rgba(164,158,203,.45)'; g.beginPath(); g.moveTo(ox + rail * R, oy - R); g.lineTo(ox + rail * R, oy + R); g.stroke();
      g.fillStyle = 'rgba(164,158,203,.5)'; for (let y = -0.9; y < 0.95; y += 0.22) { g.beginPath(); g.arc(ox + (rail + side * -0.08) * R, oy + y * R, Math.max(1, R * 0.007), 0, 7); g.fill(); }
    }
    g.restore();
    g.lineWidth = Math.max(1.5, R * 0.009) * (1 + beat * 0.8); g.strokeStyle = 'rgba(214,206,255,.85)'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.stroke();
    if (!c.thumb) {
      const y = oy + R + Math.min(40, c.H * 0.06);
      P.counter(g, c, st.p.n + ' BILLES', y);
      if (st.full) { const fs = Math.round(Math.min(c.W * 0.1, 44)); g.save(); g.font = '800 ' + fs + 'px "Unbounded", system-ui, sans-serif'; g.textAlign = 'center'; g.fillStyle = '#ff5fa8'; g.fillText('PLEIN !', c.W / 2, y + fs * 1.2); g.restore(); }
    }
    P.fade(g, c, st, 3.5);
  }

  HB.game({
    id: 'machoires', name: 'Mâchoires',
    desc: 'Deux mâchoires en dents de scie tassent les billes dans un zigzag. À chaque fermeture il en arrive plus, jusqu\'à ce que ce soit plein.',
    ranges: [
      { key: 'grow', label: 'Croissance', min: 0.2, max: 1.2, step: 0.05, value: 0.6 },
      { key: 'size', label: 'Taille billes', min: 0.7, max: 1.5, step: 0.05, value: 1, restart: true }
    ],
    thumbSteps: 200, reset, step, draw
  });
})();

<script>
/* Jeu 4 · Sablier : deux pistons claquent au centre du cercle. Les billes, attirées vers le milieu, se font
   écraser quand elles sont prises entre les pistons : chaque écrasement fait jaillir une gerbe de nouvelles
   billes vers le haut et vers le bas, jusqu'à remplir le cercle. */
(() => {
  const P = HBP, TIP = 0.15, FLARE = 0.2, OPEN = 0.24;

  function reset(c) {
    const cap = c.thumb ? 200 : Math.round(c.opt.max || 1500);
    const st = c.st = { p: P.pool(cap), r: 0.032, rmin: Math.sqrt(0.5 / cap), g: OPEN, ph: 'wait', pt: 0.6, gen: 0, t: 0, bursts: [], end: 0, crushes: 0 };
    for (let i = 0; i < 8; i++) { const a = Math.random() * 6.28; P.add(st.p, Math.cos(a) * 0.15, Math.sin(a) * 0.15, (Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01, 0, 1); }
  }
  const half = (st, x) => TIP + Math.max(0, Math.abs(x) - st.g) * FLARE;
  function pistons(st) {
    const p = st.p, X = p.X, Y = p.Y, r = st.r;
    for (let i = 0; i < p.n; i++) {
      const ax = Math.abs(X[i]), s = X[i] < 0 ? -1 : 1, hw = half(st, X[i]);
      if (ax + r <= st.g || Math.abs(Y[i]) > hw + r) continue;
      if (st.ph === 'slam' && ax < st.g + r && Math.abs(Y[i]) < TIP) { X[i] *= 0.5; p.PX[i] = X[i]; continue; }   // caught between the pistons
      // inside or touching a piston: leave by the nearest side (the tip face or the top / bottom edge)
      const dFace = ax + r - st.g, dEdge = hw + r - Math.abs(Y[i]);
      if (dFace < dEdge && ax < st.g + 0.02) { X[i] = s * (st.g - r); let vx = X[i] - p.PX[i]; if (vx * s > 0) p.PX[i] = X[i] + vx * 0.9; }
      else { const sy = Y[i] < 0 ? -1 : 1; Y[i] = sy * (hw + r); let vy = Y[i] - p.PY[i]; if (vy * sy < 0) p.PY[i] = Y[i] + vy * 0.9; }
    }
  }
  function crush(c, st) {
    const p = st.p; let k = 0;
    for (let i = p.n - 1; i >= 0; i--) if (Math.abs(p.X[i]) < 0.12 && Math.abs(p.Y[i]) < TIP + st.r * 0.3) { k++; P.remove(p, i); }
    st.bursts.push({ t: 0, k });
    if (!k) { c.note(c.scale(0), 0.4, 0.5); return; }
    const gcol = ++st.gen, m = Math.min(p.cap - p.n, Math.round(k * (c.opt.mult || 4)));
    for (let j = 0; j < m; j++) {
      const sy = j % 2 ? 1 : -1, sp = 0.012 + Math.random() * 0.014;
      P.add(p, (Math.random() - 0.5) * 0.06, sy * (TIP + st.r + 0.01 + Math.random() * 0.05), (Math.random() - 0.5) * 0.006, sy * sp, gcol, 0.3);
    }
    st.crushes++; c.note(c.scale(3 + gcol % 9), 1, 1.3);
  }
  function step(c, dt) {
    const st = c.st; if (!st) return; st.t += dt; st.pt += dt;
    if (st.ph === 'wait' && st.pt > (st.wait || 0.9)) { st.ph = 'slam'; st.pt = 0; }
    else if (st.ph === 'slam') { st.g = Math.max(0, OPEN * (1 - st.pt / 0.14)); if (st.g <= 0) { st.ph = 'hold'; st.pt = 0; crush(c, st); } }
    else if (st.ph === 'hold' && st.pt > 0.12) { st.ph = 'open'; st.pt = 0; }
    else if (st.ph === 'open') { st.g = OPEN * P.sm(st.pt / 0.45); if (st.pt >= 0.45) { st.ph = 'wait'; st.pt = 0; st.wait = 0.25 + Math.random() * 0.6; } }
    const rT = Math.max(st.rmin, Math.min(0.032, Math.sqrt(0.35 / Math.max(1, st.p.n))));
    st.r += (rT - st.r) * Math.min(1, dt * 1.5);
    const sub = 3, h = dt / sub, pull = 1.3 + (c.react ? c.react.beat * 2 : 0);
    for (let s = 0; s < sub; s++) {
      P.integrate(st.p, h, 0.85, (x, y) => [-x * pull, -y * pull], 3);
      for (let it = 0; it < 2; it++) { P.collide(st.p, st.r, -1.05, -1.05, 2.1, 2.1, 0.7); pistons(st); P.inCircle(st.p, 1, st.r, 0.8); }
    }
    for (const b of st.bursts) b.t += dt; st.bursts = st.bursts.filter(b => b.t < 0.6);
    if (st.p.n >= st.p.cap * 0.98 || st.end) { if (P.ending(c, st, dt, 'Sablier', 'Cercle rempli : ' + st.p.n + ' billes après ' + st.crushes + ' écrasements, en ' + Math.round(st.t) + ' s', 4)) reset(c); }
    if (!c.thumb) c.status(st.p.n + ' billes · ' + st.crushes + ' écrasements');
  }

  function draw(c, g) {
    const st = c.st; if (!st) return;
    const R = Math.min(c.W * 0.44, c.H * 0.38), ox = c.W / 2, oy = c.H / 2, beat = c.react ? c.react.beat : 0;
    g.fillStyle = '#100c26'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.fill();
    P.drawBalls(g, st.p, ox, oy, R, st.r);
    for (const b of st.bursts) {
      const k = b.t / 0.6; g.fillStyle = 'rgba(255,255,255,' + (0.7 * (1 - k)).toFixed(3) + ')';
      for (let j = 0; j < 14; j++) { const sy = j % 2 ? 1 : -1, yy = sy * (TIP + k * (0.2 + (j % 5) * 0.08)), xx = ((j * 37) % 11 - 5) * 0.012 * (1 + k); g.fillRect(ox + xx * R - 1.5, oy + yy * R - 1.5, 3, 3); }
    }
    g.save(); g.beginPath(); g.arc(ox, oy, R, 0, 7); g.clip();
    for (const s of [-1, 1]) {
      const x0 = s * st.g, x1 = s * 1.15, h0 = TIP, h1 = TIP + (1.15 - st.g) * FLARE;
      g.beginPath(); g.moveTo(ox + x0 * R, oy - h0 * R); g.lineTo(ox + x1 * R, oy - h1 * R); g.lineTo(ox + x1 * R, oy + h1 * R); g.lineTo(ox + x0 * R, oy + h0 * R); g.closePath();
      g.fillStyle = '#3b3666'; g.fill(); g.strokeStyle = '#a49ecb'; g.lineWidth = Math.max(1, R * 0.006); g.stroke();
      // inner frame, centre rail and rivets
      const xi = s * (st.g + 0.05), hi = TIP - 0.03;
      g.strokeStyle = 'rgba(164,158,203,.4)'; g.beginPath(); g.moveTo(ox + xi * R, oy - hi * R); g.lineTo(ox + x1 * R, oy - (h1 - 0.04) * R); g.moveTo(ox + xi * R, oy + hi * R); g.lineTo(ox + x1 * R, oy + (h1 - 0.04) * R); g.moveTo(ox + xi * R, oy - hi * R); g.lineTo(ox + xi * R, oy + hi * R); g.stroke();
      g.strokeStyle = 'rgba(20,16,40,.6)'; g.lineWidth = Math.max(1.5, R * 0.012); g.beginPath(); g.moveTo(ox + (x0 + s * 0.12) * R, oy); g.lineTo(ox + x1 * R, oy); g.stroke();
      g.fillStyle = 'rgba(164,158,203,.55)'; for (const fx of [0.3, 0.55, 0.8]) for (const fy of [-1, 1]) { const xx = s * (st.g + fx), hh = TIP + fx * FLARE - 0.05; g.beginPath(); g.arc(ox + xx * R, oy + fy * hh * R, Math.max(1, R * 0.008), 0, 7); g.fill(); }
    }
    g.restore();
    g.lineWidth = Math.max(1.5, R * 0.009) * (1 + beat * 0.8); g.strokeStyle = 'rgba(214,206,255,.85)'; g.beginPath(); g.arc(ox, oy, R, 0, 7); g.stroke();
    if (!c.thumb) P.counter(g, c, st.p.n + ' BILLES', oy - R - Math.min(34, c.H * 0.05));
    P.fade(g, c, st, 4);
  }

  HB.game({
    id: 'sablier', name: 'Sablier',
    desc: 'Deux pistons claquent au centre : chaque bille écrasée fait jaillir une gerbe de nouvelles billes.',
    ranges: [
      { key: 'mult', label: 'Multiplier', min: 2, max: 6, step: 1, value: 4 },
      { key: 'max', label: 'Billes', min: 400, max: 3000, step: 100, value: 1500, restart: true }
    ],
    thumbSteps: 300, reset, step, draw
  });
})();

<script>
/* Jeu 5 · Brèche : une raquette automatique renvoie des billes qui creusent un mur de minuscules briques
   (rose, puis grise une fois touchée, puis détruite). Des bonus tombent : billes en plus, raquette plus large,
   vitesse, billes perforantes. Quand le mur est presque vide, il explose. Monde fixe de 1 × 1.8. */
(() => {
  const WW = 1, WH = 1.8, COLS = 56, Y0 = 0.08, CELL = WW / COLS, ROWS = Math.floor(0.86 / CELL), PY = 1.56, BR = 0.0065;
  const KINDS = { multi: ['#6fd8ff', '⁂'], large: ['#8fdc6e', '↔'], fast: ['#f0a050', '»'], pierce: ['#ffe66b', '★'] };

  function reset(c) {

/* Jeu 9 · Paraboles : un anneau garni de dents, ouvert en bas à gauche, avec un poteau au centre. Une bille est

<script>

   Deux orbes du même niveau qui se touchent fusionnent en un orbe du niveau suivant, plus gros, avec une onde de
   choc. La chaîne monte jusqu'à l'orbe géant final, puis le flacon se vide. Coordonnées : flacon de rayon 1. */
(() => {

    ['#b06bff', '#4a2a8a', 'ring'], ['#ffe66b', '#c08a2a', 'sun'], ['#ff6f7d', '#8a1f2f', 'heart'], ['#f1eeff', '#8a85b8', 'crown']

  function step(c, dt) {
    const st = c.st; if (!st) return; st.t += dt;
    if (st.end) { st.end += dt; for (const o of st.o) { o.y += dt * 1.8 * st.end; } if (st.end > 3.2 && !c.thumb) reset(c); upd(st, dt); return; }

    const topFree = !st.o.some(o => o.y < NECK_TOP + 0.4);
    if (st.drop <= 0 && topFree) { add(st, (Math.random() - 0.5) * 0.02, NECK_TOP, 0, 0.004); st.drop = 1 / (c.opt.rate || 3); }
    const sub = 4, h = dt / sub, G = 3;
    for (let s = 0; s < sub; s++) {
      const mag = (c.opt.magnet == null ? 0.6 : c.opt.magnet) * h * h;           // orbs of the same level drift toward each other
      if (mag) for (let i = 0; i < st.o.length; i++) for (let j = i + 1; j < st.o.length; j++) { const p = st.o[i], q = st.o[j]; if (p.k !== q.k || p.y < NECK_BOT || q.y < NECK_BOT) continue; const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1; p.x += dx / d * mag; p.y += dy / d * mag; q.x -= dx / d * mag; q.y -= dy / d * mag; }
      for (const o of st.o) { const vx = (o.x - o.px) * 0.985, vy = (o.y - o.py) * 0.985; o.px = o.x; o.py = o.y; o.x += vx; o.y += vy + G * h * h; o.born += h; }
      for (let it = 0; it < 4; it++) {
        for (let i = 0; i < st.o.length; i++) for (let j = i + 1; j < st.o.length; j++) {
          const a = st.o[i], b = st.o[j], ra = rad(a.k), rb = rad(b.k), dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-9;
          if (d >= ra + rb) continue;
          if (a.k === b.k && a.k < LV.length - 1 && !a.dead && !b.dead && a.born > 0.12 && b.born > 0.12) { merge(c, st, a, b); continue; }
          const o = (ra + rb - d) / d, ma = ra * ra, mb = rb * rb, s2 = ma + mb;
          a.x -= dx * o * mb / s2; a.y -= dy * o * mb / s2; b.x += dx * o * ma / s2; b.y += dy * o * ma / s2;
        }
        st.o = st.o.filter(o => !o.dead);
        for (const o of st.o) walls(o);
      }
    }
    upd(st, dt);
    if (st.best >= LV.length - 1 && !st.end) { st.end = 0.001; if (!c.thumb) HBH.add('Fusion', 'Orbe géant atteint après ' + st.merges + ' fusions, en ' + Math.round(st.t) + ' s'); c.note(c.scale(16), 1, 2.5); }
    // the flask overflows: the giant never came, so it empties and starts again
    if (st.t > 240 && !st.end) { st.end = 0.001; if (!c.thumb) HBH.add('Fusion', 'Flacon plein au niveau ' + (st.best + 1) + ', ' + st.merges + ' fusions'); }
    if (!c.thumb) c.status('Niveau ' + (st.best + 1) + ' / ' + LV.length + ' · ' + st.merges + ' fusions');
  }
  function merge(c, st, a, b) {
    a.dead = b.dead = true; const k = a.k + 1, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    add(st, x, y, k, -0.004); st.best = Math.max(st.best, k); st.merges++;
    st.waves.push({ x, y, t: 0, r: rad(k) }); for (let i = 0, n = HBT.n(20 + k * 6); i < n; i++) { const an = Math.random() * 6.283, v = 0.3 + Math.random() * 0.8; st.sparks.push({ x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v, t: 0, col: LV[k][0] }); }
    c.note(c.scale(2 + k * 2), 1, 1 + k * 0.15);
  }
  function upd(st, dt) {
    for (const w of st.waves) w.t += dt; st.waves = st.waves.filter(w => w.t < 0.8);
    for (const p of st.sparks) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } st.sparks = st.sparks.filter(p => p.t < 1);
  }
  function orb(g, x, y, r, k, beat) {
    const [c1, c2, sym] = LV[k], gl = g.createRadialGradient(x, y, r * 0.6, x, y, r * 1.5);
    gl.addColorStop(0, c1 + '55'); gl.addColorStop(1, c1 + '00'); g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 1.5, 0, 7); g.fill();
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * (1 + beat * 0.03), 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.fillStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1, r * 0.1); g.lineCap = 'round'; g.lineJoin = 'round';
    const u = r * 0.5; g.beginPath();
    if (sym === 'flame') { g.moveTo(x, y - u); g.quadraticCurveTo(x + u, y, x, y + u); g.quadraticCurveTo(x - u, y, x, y - u); g.fill(); }
    else if (sym === 'wave') { g.moveTo(x - u, y); g.bezierCurveTo(x - u * 0.5, y - u, x, y + u, x + u, y - u * 0.2); g.stroke(); }
    else if (sym === 'leaf') { g.moveTo(x - u, y + u); g.quadraticCurveTo(x - u, y - u, x + u, y - u); g.quadraticCurveTo(x + u, y + u, x - u, y + u); g.stroke(); }
    else if (sym === 'star') { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? u * 0.45 : u; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }
    else if (sym === 'ring') { g.arc(x, y, u * 0.75, 0, 7); g.stroke(); g.beginPath(); g.arc(x, y, u * 0.3, 0, 7); g.fill(); }
    else if (sym === 'sun') { g.arc(x, y, u * 0.45, 0, 7); g.fill(); g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.moveTo(x + Math.cos(a) * u * 0.65, y + Math.sin(a) * u * 0.65); g.lineTo(x + Math.cos(a) * u, y + Math.sin(a) * u); } g.stroke(); }
    else if (sym === 'heart') { g.moveTo(x, y + u * 0.8); g.bezierCurveTo(x - u * 1.3, y - u * 0.1, x - u * 0.5, y - u, x, y - u * 0.35); g.bezierCurveTo(x + u * 0.5, y - u, x + u * 1.3, y - u * 0.1, x, y + u * 0.8); g.fill(); }
    else if (sym === 'drop') { g.moveTo(x, y - u); g.quadraticCurveTo(x + u * 0.9, y + u * 0.2, x, y + u * 0.8); g.quadraticCurveTo(x - u * 0.9, y + u * 0.2, x, y - u); g.fill(); }
    else { g.moveTo(x - u, y + u * 0.5); g.lineTo(x - u, y - u * 0.4); g.lineTo(x - u * 0.45, y + u * 0.05); g.lineTo(x, y - u * 0.7); g.lineTo(x + u * 0.45, y + u * 0.05); g.lineTo(x + u, y - u * 0.4); g.lineTo(x + u, y + u * 0.5); g.closePath(); g.fill(); }
  }
  function draw(c, g) {
    const st = c.st; if (!st) return;
    const R = Math.min(c.W * 0.44, c.H / 3.6), ox = c.W / 2, oy = c.H - R * 1.25, X = x => ox + x * R, Y = y => oy + y * R, beat = c.react ? c.react.beat : 0;
    // flask outline with a gradient like the video (purple, pink, orange, green)
    const a0 = -Math.PI / 2 + Math.asin(NECK), a1 = -Math.PI / 2 - Math.asin(NECK) + 2 * Math.PI;
    const gr = g.createLinearGradient(X(-1), 0, X(1), 0); gr.addColorStop(0, '#7f5cff'); gr.addColorStop(0.35, '#ff5fa8'); gr.addColorStop(0.65, '#ff9a3c'); gr.addColorStop(1, '#8fdc6e');
    g.strokeStyle = gr; g.lineWidth = Math.max(2, R * 0.022) * (1 + beat * 0.5); g.lineJoin = 'round';
    g.beginPath(); g.moveTo(X(-NECK), Y(NECK_TOP - 0.4)); g.lineTo(X(-NECK), Y(-Math.cos(Math.asin(NECK)))); g.arc(ox, oy, R, -Math.PI / 2 - Math.asin(NECK), a0 - 2 * Math.PI + 2 * Math.PI, true);
    g.lineTo(X(NECK), Y(NECK_TOP - 0.4)); g.stroke();
    void a1;
    for (const w of st.waves) { const k = w.t / 0.8; g.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)).toFixed(2) + ')'; g.lineWidth = Math.max(1, R * 0.008); for (const d of [0, 0.15, 0.3]) { g.beginPath(); g.arc(X(w.x), Y(w.y), (w.r + (k + d) * 0.35) * R, 0, 7); g.stroke(); } }
    for (const o of st.o) orb(g, X(o.x), Y(o.y), rad(o.k) * R * Math.min(1, 0.6 + o.born * 4), o.k, beat);
    for (const p of st.sparks) { g.globalAlpha = Math.max(0, 1 - p.t); g.fillStyle = p.col; g.fillRect(X(p.x) - 1.5, Y(p.y) - 1.5, 3, 3); } g.globalAlpha = 1;

    if (!c.thumb) { const s0 = Math.min(18, c.W * 0.045); for (let k = 0; k < LV.length; k++) { const yy = c.H * 0.08 + k * s0 * 2.4; g.globalAlpha = k <= st.best ? 1 : 0.25; orb(g, c.W - s0 * 1.8, yy, s0 * (0.6 + k * 0.05), k, 0); } g.globalAlpha = 1; }
  }
  HB.game({
    id: 'fusion', name: 'Fusion',
    desc: 'Des orbes tombent dans un flacon : deux identiques fusionnent en un plus gros, jusqu\'à l\'orbe géant.',
    ranges: [{ key: 'rate', label: 'Débit', min: 0.8, max: 5, step: 0.1, value: 3 }, { key: 'magnet', label: 'Aimant', min: 0, max: 2, step: 0.05, value: 0.6 }],
    thumbSteps: 900, reset, step, draw
  });
})();
</script>
<script>
/* App shell: one view per game. A game registers { enter, leave } in window.HypnoGames under its id,
   owns the element #view-<id>, and gets a card in the home menu with data-game="<id>". */
(() => {
  const home = document.getElementById('home'), games = window.HypnoGames;
  let current = null;
  function show(id) {
    if (!games[id]) id = null;
    if (id === current) return;
    if (current) { games[current].leave(); document.getElementById('view-' + current).hidden = true; }
    current = id; home.hidden = !!id;
    if (id) { document.getElementById('view-' + id).hidden = false; games[id].enter(); }
    try { const want = id || 'jeux'; if (location.hash.slice(1) !== want) location.hash = want; } catch (e) {}
  }
  document.addEventListener('click', e => {
    const card = e.target.closest('[data-game]'); if (card) return show(card.dataset.game);
    if (e.target.closest('[data-home]')) show(null);
  });
  document.getElementById('hist-btn').addEventListener('click', () => HBH.open());
  const cap = document.getElementById('caption'); cap.value = HBX.caption;
  cap.addEventListener('input', () => HBX.setCaption(cap.value));
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
