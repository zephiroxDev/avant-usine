<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hypno Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@500;700&display=swap">
<style>
  /* Layout: the arena fills the screen like a vertical video; a compact control deck sits under it and disappears in recording mode. */
  :root {
    color-scheme: dark;
    --bg: #0d0b1e;
    --deck: #1a1733;
    --edge: #322d5c;
    --ink: #f1eeff;
    --ink-soft: #a7a2cc;
    --accent: #ff5fa8;
    --accent-ink: #1b0a14;
    --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    box-sizing: border-box;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .deck { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 15px; margin: 0; letter-spacing: .02em; }
  .status { font-size: 13px; color: var(--ink-soft); flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  button, .file {
    font: inherit; font-weight: 700; font-size: 14px;
    color: var(--ink); background: var(--deck);
    border: 0; box-shadow: inset 0 0 0 1px var(--edge);
    border-radius: 12px; padding: 10px 12px; cursor: pointer;
    flex: 1 1 auto; text-align: center;
  }
  .file { position: relative; }
  .file input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .file:focus-within, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.main { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  button:active, .file:active { transform: scale(.97); }
  button:disabled, input:disabled { opacity: .4; }
  .sliders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sliders label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; min-width: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 24px; }
  .inst label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  select { font: inherit; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 12px; padding: 9px 10px; flex: 1; }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* ---- app shell: home menu ---- */
  .home { height: 100%; max-width: 560px; margin: 0 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding-block: 18px; box-sizing: border-box; }
  .brand { display: flex; flex-direction: column; gap: 8px; }
  .brand .name { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 52px); line-height: 1; letter-spacing: -.01em; margin: 0; }
  .brand .name b { color: var(--accent); font-weight: 800; }
  .brand p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.45; max-width: 34ch; }
  .shelf-label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 0; }
  .shelf { display: flex; flex-direction: column; gap: 12px; }
  .game {
    display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; text-align: left;
    background: var(--deck); border-radius: 20px; padding: 12px; box-shadow: inset 0 0 0 1px var(--edge); flex: none;
    color: var(--ink); font-weight: 500; font-size: 14px;
  }
  .game > div { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .game .gname { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; }
  .game .gdesc { color: var(--ink-soft); line-height: 1.35; }
  .game .go { align-self: flex-start; margin-top: 3px; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 99px; padding: 6px 16px; }
  .game.soon { background: none; box-shadow: none; border: 1.5px dashed var(--edge); cursor: default; }
  .game.soon .gname { color: var(--ink-soft); }
  .thumb { width: 92px; height: 92px; border-radius: 16px; background: var(--bg); position: relative; overflow: hidden; }
  .thumb.ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 14px var(--accent); animation: tint 6s linear infinite; }
  .thumb.ring::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); left: 39px; top: 39px; animation: hop 1.7s ease-in-out infinite alternate, hopx 2.3s ease-in-out infinite alternate; }
  .thumb.empty::before { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; color: var(--edge); }
  @keyframes hop { from { top: 20px; } to { top: 58px; } }
  @keyframes hopx { from { left: 22px; } to { left: 56px; } }
  @keyframes tint { to { filter: hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .thumb.ring::before, .thumb.ring::after { animation: none; } }
  .back { flex: 0 0 auto; padding: 7px 12px; }
  .more { display: flex; flex-direction: column; gap: 10px; }
  .sliders.one { grid-template-columns: 1fr; }
  .sliders.two { grid-template-columns: 1fr 1fr; }
  .file span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 44vw; }
  .sheet { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 94%, transparent); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 16px; }
  .sheet-head button { flex: 0 0 auto; }
  .sheet-tip { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .sheet > button { flex: none; }
  .racers { display: flex; flex-direction: column; gap: 8px; }
  .racer { display: grid; grid-template-columns: 50px 1fr 42px; gap: 8px; align-items: center; }
  .pic { width: 46px; height: 46px; box-sizing: border-box; border-radius: 50%; border: 3px solid hsl(var(--h) 92% 62%); background: var(--deck) center / cover; position: relative; overflow: hidden; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .pic input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .pic:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text] { font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
  input[type=text]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .del { padding: 8px 0; font-size: 18px; line-height: 1; }
  .winrow { display: flex; flex-direction: column; gap: 6px; }
  .racer-more { grid-column: 1 / -1; display: grid; grid-template-columns: 44px 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .racer-more input[type=color] { width: 44px; height: 38px; padding: 0; border: 0; border-radius: 10px; background: none; }
  .racer-more select { padding: 7px 8px; font-size: 13px; }
  .team { padding: 7px 8px; font-size: 12px; }
  .team.t0 { box-shadow: inset 0 0 0 2px #ff5fa8; } .team.t1 { box-shadow: inset 0 0 0 2px #6fd8ff; }
  .sheet-h { margin: 6px 0 0; font-family: var(--font-display); font-size: 13px; }
  .cfg.grp { grid-template-columns: 1fr 40px; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .stepline { display: grid; grid-template-columns: 58px 1fr 1fr 58px 36px; gap: 5px; align-items: end; }
  .stepf { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stepf span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .stepf select, .stepf input { min-width: 0; width: 100%; box-sizing: border-box; padding: 7px 6px; font-size: 13px; }
  input[type=number] { font: inherit; font-weight: 700; color: var(--ink); background: var(--deck); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 10px; }
  .stepline .ic { padding: 8px 0; }
  .winrow span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  canvas.thumb { position: static; width: 92px; height: 92px; }
  body.rec { padding: 0; }
  body.rec .deck { display: none; }
  body.rec .app { max-width: none; gap: 0; }
  body.rec .stage { border-radius: 0; box-shadow: none; }
  body.rec:not(.cine) .app { justify-content: center; align-items: center; }
  body.rec:not(.cine) .stage { flex: none; width: min(100%, calc(100vh * 9 / 16)); width: min(100%, calc(100dvh * 9 / 16)); height: auto; aspect-ratio: 9 / 16; }   /* videos are always 9:16 */
  .hook { display: flex; flex-direction: column; gap: 6px; }
  .hook span { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .export { position: fixed; inset: 0; z-index: 10; background: rgba(8,6,20,.82); display: grid; place-items: center; padding: 16px; }
  .export-card { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--deck); border-radius: 20px; padding: 14px; box-shadow: inset 0 0 0 1px var(--edge); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
  .export video { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 14px; background: var(--bg); }
  .export-title { margin: 0; font-family: var(--font-display); font-size: 15px; }
  .export-msg { margin: 0; min-height: 1.2em; color: var(--ink-soft); font-size: 13px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  .tab { flex: 0 0 auto; padding: 8px 12px; font-size: 13px; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
  .tab-body, .tab-pane { display: flex; flex-direction: column; gap: 10px; }
  .cfg-list { display: flex; flex-direction: column; gap: 6px; }
  .cfg { display: grid; grid-template-columns: 40px 1fr 40px 52px; gap: 6px; align-items: center; }
  .cfg .ic { padding: 8px 0; font-size: 16px; }
  .cfg .ic.danger { background: #ff4d6a; color: #1b0a14; font-size: 12px; }
  .cfg-name { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gamepane h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 13px; }
  .stats { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .stats th, .stats td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--edge); }
  .stats th:first-child, .stats td:first-child { text-align: left; }
  .stats-wrap { overflow-x: auto; }
  .cine-hint { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: rgba(13,11,30,.82); color: var(--ink); padding: 10px 14px; border-radius: 99px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cine-hint.show { opacity: 1; }
  .err-toast { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); background: #3a1530; max-width: 86vw; text-align: center; }
  .hist { display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow-y: auto; font-size: 13px; }
  .hist p { margin: 0; line-height: 1.35; } .hist span { display: block; color: var(--ink-soft); font-size: 11px; }
  .hist-btn { align-self: flex-start; flex: none; }
  @media (max-height: 620px) { .sliders label span { display: none; } }
</style>

<main class="home" id="home">
  <div class="brand">
    <h1 class="name">Hypno<b>Box</b></h1>
    <p>Des jeux à regarder autant qu'à jouer, pensés pour l'écran vertical.</p>
  </div>
  <button type="button" id="hist-btn" class="hist-btn">Historique et statistiques</button>
  <label class="hook"><span>Texte d'accroche de tes vidéos</span><input type="text" id="caption" maxlength="60" placeholder="Ex. : Attends la fin…" autocomplete="off"></label>
  <p class="shelf-label">Jeux</p>
  <div class="shelf">
    <div class="game soon">
      <span class="thumb empty"></span>
      <div>
        <span class="gname">Prochain jeu</span>
        <span class="gdesc">Tes nouveaux jeux s'ajouteront ici.</span>
      </div>
    </div>
  </div>
</main>

<script>
/* Shared tools for every game: the hook text drawn on top of the video, and the built-in video export
   (canvas + game sound recorded together, then offered as a file). */
window.HBX = (() => {
  let caption = '';
  try { caption = localStorage.getItem('hypno.caption') || ''; } catch (e) {}
  const dlP = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  function lines(g, text, maxW) {
    const words = text.split(/\s+/), out = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    if (cur) out.push(cur); return out.slice(0, 3);
  }
  const st = Object.assign({ size: 1, pos: 'haut', color: '#ffffff', hide: false, dur: 0, cd: 3, loop: false }, (() => { try { return JSON.parse(localStorage.getItem('hypno.studio') || '{}'); } catch (e) { return {}; } })());
  const saveSt = () => { try { localStorage.setItem('hypno.studio', JSON.stringify(st)); } catch (e) {} };
  function drawCaption(g, W, H) {
    if (!caption || st.hide) return;
    const fs = Math.round(Math.min(W * 0.068, H * 0.04, 36) * st.size);
    g.save(); g.textAlign = 'center'; g.textBaseline = 'top'; g.font = '800 ' + fs + 'px "Unbounded", system-ui, sans-serif';
    g.lineJoin = 'round'; g.lineWidth = fs * 0.28; g.strokeStyle = st.color === '#0d0b1e' ? 'rgba(255,255,255,.92)' : 'rgba(13,11,30,.9)'; g.fillStyle = st.color; g.shadowBlur = 0;
    const ls = lines(g, caption, W * 0.86), y0 = st.pos === 'milieu' ? H * 0.46 - ls.length * fs * 0.61 : st.pos === 'bas' ? H * 0.9 - ls.length * fs * 1.22 : H * 0.055;
    ls.forEach((l, i) => { const y = y0 + i * fs * 1.22; g.strokeText(l, W / 2, y); g.fillText(l, W / 2, y); });
    g.restore();
  }
  let rec = null;
  function pickType() {
    if (!window.MediaRecorder) return null;
    for (const t of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'])
      if (MediaRecorder.isTypeSupported(t)) return t;
    return null;
  }
  function startRec(canvas, ac, master, name) {
    stopRec(true);
    const type = pickType(); if (!type || !canvas.captureStream) return false;
    try {
      const stream = canvas.captureStream(60); let dest = null;
      if (ac && master && ac.createMediaStreamDestination) { dest = ac.createMediaStreamDestination(); master.connect(dest); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t)); }
      const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 }), chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec = { mr, chunks, dest, master, type, name, t0: performance.now(), stream };
      mr.start(500); return true;
    } catch (e) { rec = null; return false; }
  }
  function stopRec(silent) {
    const r = rec; rec = null; if (!r) return;
    r.mr.onstop = () => {
      try { if (r.dest) r.master.disconnect(r.dest); } catch (e) {}
      r.stream.getTracks().forEach(t => t.stop());
      if (silent) return;
      if (!r.chunks.length) { HBH.err('Vidéo : aucune image reçue par l\'enregistreur (' + r.type + ')'); return; }
      HBH.add('Vidéo', r.name + ' · ' + Math.round((performance.now() - r.t0) / 1000) + ' s · ' + (r.type.includes('mp4') ? 'MP4' : 'WebM'));
      sheet(new Blob(r.chunks, { type: r.type.split(';')[0] }), r.type.includes('mp4') ? 'mp4' : 'webm', (performance.now() - r.t0) / 1000, r.name);
    };
    try { r.mr.stop(); } catch (e) {}
  }
  function sheet(blob, ext, secs, name) {
    const url = URL.createObjectURL(blob), box = document.createElement('div'); box.className = 'export';
    box.innerHTML = '<div class="export-card" role="dialog" aria-label="Vidéo prête"><video playsinline loop muted autoplay></video>' +
      '<p class="export-title">Ta vidéo est prête · ' + Math.round(secs) + ' s</p><p class="export-msg" aria-live="polite"></p>' +
      '<div class="row"><button class="main" type="button" data-save>Enregistrer la vidéo</button><button type="button" data-close>Fermer</button></div></div>';
    const v = box.querySelector('video'), msg = box.querySelector('.export-msg'); v.src = url;
    v.addEventListener('click', () => { v.muted = !v.muted; });
    document.body.appendChild(box);
    const close = () => { URL.revokeObjectURL(url); box.remove(); };
    box.querySelector('[data-close]').addEventListener('click', close);
    box.querySelector('[data-save]').addEventListener('click', async e => {
      const btn = e.currentTarget, file = 'hypnobox-' + name + '-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.' + ext;
      btn.disabled = true; msg.textContent = '';
      const dl = await Promise.race([dlP, new Promise(ok => setTimeout(() => ok(null), 1500))]);
      try {
        if (dl) { await dl.save({ filename: file, data: blob }); msg.textContent = 'Vidéo enregistrée.'; }
        else { const a = document.createElement('a'); a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove(); msg.textContent = 'Téléchargement lancé.'; }
      } catch (err) {
        msg.textContent = err && err.code === 'declined' ? 'Enregistrement annulé.' : 'Impossible d\'enregistrer ici. Réessaie dans un instant.';
      }
      btn.disabled = false;
    });
  }
  return {
    get caption() { return caption; },
    setCaption(t) { caption = t.trim().slice(0, 60); try { localStorage.setItem('hypno.caption', caption); } catch (e) {} },
    drawCaption, startRec, stopRec, canRecord: () => !!pickType(),
    studio: st, saveStudio: saveSt, get recording() { return !!rec; },
    due() { return !!rec && st.dur > 0 && !st.loop && (performance.now() - rec.t0) / 1000 >= st.dur; }   // planned length reached
  };
})();
</script>
<script>
/* History of games and problems met, for every game. Errors are shown briefly and kept, so a crash can be traced. */
window.HBH = (() => {
  const K = 'hypno.history', KE = 'hypno.errors';
  const rd = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
  const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  function add(game, text) { const l = rd(K); l.unshift({ t: Date.now(), g: game, x: text }); wr(K, l.slice(0, 150)); }
  // real play time and sessions per game (only counted when a game was open for more than 3 s)
  function time(game, secs) { if (!(secs > 3)) return; let s0 = {}; try { s0 = JSON.parse(localStorage.getItem('hypno.stats') || '{}'); } catch (e) {} const g = s0[game] || { s: 0, n: 0 }; g.s += secs; g.n++; s0[game] = g; try { localStorage.setItem('hypno.stats', JSON.stringify(s0)); } catch (e) {} }
  const seen = new Set(), toast = document.createElement('div'); toast.className = 'cine-hint err-toast'; document.body.appendChild(toast);
  function err(m) {
    m = String(m || 'erreur inconnue').slice(0, 160); const l = rd(KE); l.unshift({ t: Date.now(), x: m }); wr(KE, l.slice(0, 30));
    if (seen.has(m)) return; seen.add(m);
    toast.textContent = 'Un problème est survenu. Le jeu continue, et l\'erreur est notée dans l\'historique.'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 4000);
  }
  window.addEventListener('error', e => err((e.message || 'erreur') + (e.lineno ? ' (ligne ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => err(e.reason && (e.reason.message || e.reason)));
  const fmt = t => { const d = new Date(t); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
  function open() {
    const box = document.createElement('div'); box.className = 'export';
    const l = rd(K), errs = rd(KE), games = {};
    for (const e of l) { games[e.g] = games[e.g] || { n: 0, last: e }; games[e.g].n++; }

    const id = view.id, sh = document.createElement('div'); sh.className = 'tab-pane'; sh.dataset.nocfg = '';
    sh.innerHTML = '<p class="sheet-tip" data-track></p>' +
      '<div class="row"><button class="main" type="button" data-play>Lire le morceau</button><button type="button" data-restart>Depuis le début</button><button type="button" data-clear>Retirer</button></div>' +
      '<p class="sheet-tip" data-info></p>' +
      '<label class="winrow" for="' + id + '-mgp"><span>Influence de la musique sur le jeu</span><select id="' + id + '-mgp" data-gp><option value="0">Aucune (le jeu suit ses propres règles)</option><option value="0.5">Légère</option><option value="1">Équilibrée</option><option value="1.7">Forte</option></select></label>' +
      '<p class="sheet-tip">Chaque jeu utilise la musique à sa façon : pinces qui attrapent sur le battement, pistons qui claquent sur la grosse caisse, vitesse qui suit l\'énergie… Sans morceau, le jeu tourne normalement.</p>' +
      '<label class="winrow" for="' + id + '-mvol"><span>Volume du morceau</span><input type="range" id="' + id + '-mvol" data-vol min="0" max="1" step="0.05"></label>' +
      '<p class="sheet-tip">À zéro, le morceau reste muet : il sert seulement à faire réagir l\'animation. Les notes rejouées par les jeux ne changent pas.</p>' +
      '<label class="winrow" for="' + id + '-mint"><span>Réaction de l\'animation</span><input type="range" id="' + id + '-mint" data-int min="0" max="2" step="0.05"></label>' +
      '<label class="winrow" for="' + id + '-mmode"><span>L\'animation réagit à</span><select id="' + id + '-mmode" data-mode><option value="all">Tout le rythme (automatique)</option><option value="bass">Basses seulement</option><option value="perc">Percussions</option></select></label>' +
      '<p class="sheet-tip">Ce réglage-ci ne concerne que les effets visuels : lumières, ondes, pulsations.</p>';
    sheets.push(sh);
    sh.querySelector('[data-play]').addEventListener('click', () => { if (playing) pause(); else play(); });
    sh.querySelector('[data-restart]').addEventListener('click', restart);
    sh.querySelector('[data-clear]').addEventListener('click', clear);
    sh.querySelector('[data-gp]').addEventListener('change', e => { gp = +e.target.value; saveP(); refresh(); });
    sh.querySelector('[data-vol]').addEventListener('input', e => { vol = +e.target.value; if (gain) gain.gain.value = vol; saveP(); refresh(); });
    sh.querySelector('[data-int]').addEventListener('input', e => { inten = +e.target.value; saveP(); refresh(); });
    sh.querySelector('[data-mode]').addEventListener('change', e => { mode = e.target.value; saveP(); refresh(); });
    buttons.push(HBUI.addTab(view, 'Musique', sh, refresh).b);
    refresh();
  }
  // a video starts with the song from its beginning, so picture and music line up
  const startRec0 = HBX.startRec;
  HBX.startRec = (...a) => { if (curves && playing) restart(); return startRec0(...a); };
  return { attach, setTrack, react, game, clear, play, pause, restart, get influence() { return gp; }, get buffer() { return buf; }, get playing() { return playing; }, get curves() { return curves; } };
})();

<script>
/* Shared kit for the simple games: builds the game screen and its menu card, runs the loop, handles sound,
   pause, restart and recording mode. A game only supplies reset / step / draw. */
window.HB = (() => {
  const BG = '#0d0b1e', PENTA = [0, 2, 4, 7, 9];
  let ac = null, master = null, lastNote = 0;
  function audio() {
    const sh = window.__rebond && window.__rebond.ctx ? window.__rebond.ctx() : null;
    if (sh) { ac = sh.ac; master = sh.master; return ac; }
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 8; master.connect(ac.destination); }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function note(m, vel, dec) {
    if (!ac) return false; const now = ac.currentTime; if (now - lastNote < 0.028) return false; lastNote = now;
    const f = 440 * Math.pow(2, (m - 69) / 12), k = dec || 1;
    for (const [ratio, vol, d] of [[1, 0.3, 1.3], [4, 0.06, 0.45], [5.4, 0.03, 0.25]]) {
      if (f * ratio > 15000) continue;
      const o = ac.createOscillator(), v = ac.createGain(); o.frequency.value = f * ratio;
      v.gain.setValueAtTime(0.0001, now); v.gain.exponentialRampToValueAtTime(vol * vel, now + 0.005); v.gain.exponentialRampToValueAtTime(0.0001, now + d * k);
      o.connect(v).connect(master); o.start(now); o.stop(now + d * k + 0.02);
    }
    return true;
  }
  const scale = i => 60 + 12 * Math.floor(i / 5) + PENTA[((i % 5) + 5) % 5];
  // Imported music, shared by every game: once set, each sound a game makes plays the next note of the melody.
  let melody = null; const importLabels = [];
  function setMelody(name, slices) {
    melody = slices && slices.length ? { notes: slices, i: 0, name } : null;
    importLabels.forEach(el => { el.textContent = melody ? '♪ ' + name : 'Importer une musique'; });
  }
  async function importFile(f, prog) {
    const a = audio(); if (!a) throw new Error('audio');
    const data = await f.arrayBuffer();
    const buf = await new Promise((ok, ko) => { const pr = a.decodeAudioData(data, ok, ko); if (pr && pr.catch) pr.catch(ko); });
    const name = f.name.replace(/\.[^.]+$/, '');
    setMelody(name, await window.__rebond.load(buf, name, prog));
  }

  function game(def) {
    const view = document.createElement('div'); view.className = 'app'; view.id = 'view-' + def.id; view.hidden = true;
    view.innerHTML =
      '<div class="stage"><canvas aria-label="' + def.name + '"></canvas></div>' +
      '<div class="deck"><div class="row"><button class="back" type="button" data-home>‹ Jeux</button><h1>' + def.name + '</h1><div class="status"></div></div>' +
      '<div class="row"><label class="file"><span data-import>Importer une musique</span><input type="file" data-music id="' + def.id + '-file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac"></label><button class="main" type="button" data-a="play">Lancer avec le son</button><button type="button" data-a="reset">Recommencer</button><button type="button" data-a="rec">Filmer la vidéo</button></div>' +
      '<div class="sliders one"><label><span>Vitesse</span><input type="range" id="' + def.id + '-speed" min="0.4" max="2.5" step="0.05" value="1"></label></div></div>';
    document.body.appendChild(view);
    const cv = view.querySelector('canvas'), g = cv.getContext('2d'), stage = view.querySelector('.stage');
    const statusEl = view.querySelector('.status'), playBtn = view.querySelector('[data-a=play]'), speedEl = view.querySelector('#' + def.id + '-speed');
    let entered = 0, active = false, running = false, soundOn = false, countdown = 0, rec = false, dpr = 1, last = 0, raf = 0;
    const c = {
      W: 0, H: 0, clear: true, slow: false, opt: {}, scale, status(t) { statusEl.textContent = t; },
      note(m, v, d) { if (!soundOn) return; if (!melody) return void note(m, v, d); if (note(melody.notes[melody.i % melody.notes.length].m, v, d)) melody.i++; }
    };
    const restart = () => { if (melody) melody.i = 0; c.acc = 0; if (window.HBP && HBP.seed) HBP.seed((Math.random() * 4294967296) >>> 0); def.reset(c); c.clear = true; };
    const importSpan = view.querySelector('[data-import]'); importLabels.push(importSpan); if (melody) importSpan.textContent = '♪ ' + melody.name;
    view.querySelector('[data-music]').addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      importSpan.textContent = 'Analyse…';
      // the file is decoded by the browser itself (free, local): if it cannot read it, say so and keep the previous song
      try {
        await importFile(f, p => { importSpan.textContent = 'Analyse… ' + Math.round(p * 100) + ' %'; });
        if (!HBM.curves) throw new Error('analyse');
        restart(); soundOn = true; running = true; label();
        const cv0 = HBM.curves; HBH.add('Musique', 'Importée : « ' + f.name.replace(/\.[^.]+$/, '').slice(0, 60) + ' » · ' + Math.round(cv0.dur) + ' s, ' + cv0.kicks.length + ' battements' + (cv0.tempo ? ', ~' + cv0.tempo + ' BPM' : ''));
        c.status('Morceau prêt : ' + cv0.kicks.length + ' battements détectés');
      } catch (err) {
        e.target.value = ''; importSpan.textContent = '⚠ Fichier non lisible'; setTimeout(() => { importSpan.textContent = HB.melody ? '♪ ' + HB.melody.name : 'Importer une musique'; }, 4500);
        const why = err && err.message === 'audio' ? 'le son est bloqué par le navigateur' : 'ce format n\'est pas lisible par ce navigateur (essaie MP3, M4A ou WAV)';
        c.status('Import impossible : ' + why); HBH.err('Import musique « ' + f.name.slice(0, 60) + ' » : ' + why + (err && err.message ? ' [' + err.message + ']' : ''));
      }
    });
    for (const r of def.ranges || []) {
      const sl = view.querySelector('.sliders'); sl.classList.remove('one'); sl.style.gridTemplateColumns = 'repeat(' + (1 + def.ranges.length) + ', 1fr)';
      const lab = document.createElement('label'); lab.innerHTML = '<span>' + r.label + '</span><input type="range" id="' + def.id + '-' + r.key + '" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '" value="' + r.value + '"' + (r.restart ? ' data-restart="1"' : '') + '>';
      sl.appendChild(lab); c.opt[r.key] = r.value;
      lab.querySelector('input').addEventListener('input', e => { c.opt[r.key] = parseFloat(e.target.value); if (r.restart) restart(); });
    }
    let ema = 0.016, layer = null, lg = null, preRoll = 0, recLeft = 0;
    function recFail() { stopFilm(); c.status('Le navigateur a refusé l\'enregistrement vidéo.'); HBH.err('Vidéo : démarrage de l\'enregistrement refusé'); }
    function stopFilm() { rec = false; countdown = 0; preRoll = 0; recLeft = 0; c.looping = false; document.body.classList.remove('rec'); soundOn = true; label(); HBX.stopRec(); resize(); }

    function resize() {
      const r = stage.getBoundingClientRect(); c.W = r.width; c.H = r.height; dpr = document.body.classList.contains('rec') && rec ? Math.min(3, Math.max(HBT.dpr(), 1080 / Math.max(1, c.W))) : HBT.dpr();   // videos: at least 1080 px wide
      cv.width = Math.max(1, Math.round(c.W * dpr)); cv.height = Math.max(1, Math.round(c.H * dpr)); c.clear = true;
    }
    new ResizeObserver(resize).observe(stage);
    const label = () => { playBtn.textContent = !soundOn ? 'Lancer avec le son' : running ? 'Pause' : 'Reprendre'; };
    function frame(now) {
      if (!active) return;
      const raw = (now - last) / 1000 || 0.016, dt = Math.min(0.033, raw); last = now;
      ema = ema * 0.9 + Math.min(0.2, raw) * 0.1; c.slow = ema > 0.024; if (!c.thumb) HBT.tick(ema > 0.026, raw);
      const mr = window.HBM ? HBM.react() : null; c.react = mr && mr.on ? mr : null;
      // the song as a game input: each game decides what a kick, an attack, the energy or a silence does to its mechanism
      c.mus = window.HBM && running && countdown <= 0 ? HBM.game(def.id) : null;
      if (c.mus && c.mus.on && def.music && c.st) try { def.music(c, c.mus); } catch (err) { HBH.err(def.id + ' musique : ' + err.message); }
      if (countdown > 0) { countdown -= dt; if (countdown <= 0) { restart(); soundOn = true; running = true;
        const L = HBX.studio.loop && def.loopLen ? def.loopLen(c) : 0;
        if (L) { preRoll = L; recLeft = 0; c.status('Tour de chauffe : la boucle commence dans un cycle'); } else if (!HBX.startRec(cv, ac, master, def.id)) recFail(); } }
      const sdt = running ? dt * parseFloat(speedEl.value) : 0;
      if (preRoll > 0) { preRoll -= sdt; if (preRoll <= 0) { HBX.startRec(cv, ac, master, def.id); recLeft = def.loopLen(c); c.looping = true; } }
      else if (recLeft > 0) { recLeft -= sdt; if (recLeft <= 0) stopFilm(); }
      if (rec && countdown <= 0 && HBX.due()) stopFilm();
      // fixed-step physics: the same simulation at 30, 60 or 120 images per second; a long pause is dropped, not replayed
      if (running && countdown <= 0 && c.W > 0) { const n = HB.fixedSteps(c, Math.min(0.25, raw) * parseFloat(speedEl.value)); for (let i = 0; i < n; i++) def.step(c, HB.FIX); }
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      let dg = g;
      if (def.fade) {
        if (!layer) { layer = document.createElement('canvas'); lg = layer.getContext('2d'); }
        if (layer.width !== cv.width || layer.height !== cv.height) { layer.width = cv.width; layer.height = cv.height; c.clear = true; }
        lg.setTransform(dpr, 0, 0, dpr, 0, 0); dg = lg;
      }
      if (def.fade && !c.clear) { dg.globalAlpha = def.fade; dg.fillStyle = BG; dg.fillRect(0, 0, c.W, c.H); dg.globalAlpha = 1; }
      else { dg.fillStyle = BG; dg.fillRect(0, 0, c.W, c.H); c.clear = false; }
      if (c.W > 0) {
        def.draw(c, dg);
        if (dg !== g) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(layer, 0, 0); g.setTransform(dpr, 0, 0, dpr, 0, 0); }
        if (c.react && !def.ownGlow) {                 // beat glow around the frame
          const a = Math.min(0.35, c.react.beat * 0.16 + c.react.strong * 0.04);
          if (a > 0.01) { const gr = g.createRadialGradient(c.W / 2, c.H / 2, Math.min(c.W, c.H) * 0.35, c.W / 2, c.H / 2, Math.hypot(c.W, c.H) * 0.6); gr.addColorStop(0, 'rgba(255,95,168,0)'); gr.addColorStop(1, 'rgba(255,95,168,' + a.toFixed(3) + ')'); g.fillStyle = gr; g.fillRect(0, 0, c.W, c.H); }
        }
        HBT.post(g, c.W, c.H, cv);
        HBX.drawCaption(g, c.W, c.H);
      }
      if (countdown > 0) {
        const u = Math.min(c.W, c.H);
        g.globalAlpha = 0.6; g.fillStyle = BG; g.fillRect(0, 0, c.W, c.H); g.globalAlpha = 1; g.fillStyle = '#f1eeff'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '800 ' + Math.round(u * 0.3) + 'px "Unbounded", system-ui, sans-serif'; g.fillText(String(Math.ceil(countdown)), c.W / 2, c.H / 2);
        g.font = '500 ' + Math.max(13, Math.round(u * 0.04)) + 'px "DM Sans", system-ui, sans-serif'; g.fillText('Touche l\'écran pour arrêter la vidéo', c.W / 2, c.H / 2 + u * 0.3);
        c.clear = true;
      }
      raf = requestAnimationFrame(frame);
    }
    view.addEventListener('click', e => {
      const a = e.target.closest('[data-a]'); if (!a) return; audio();
      if (a.dataset.a === 'play') { if (!soundOn) { restart(); soundOn = true; running = true; } else running = !running;
        if (HBM.curves) { if (running && !HBM.playing) HBM.play(); else if (!running && HBM.playing) HBM.pause(); } }      // the song pauses with the game
      if (a.dataset.a === 'reset') { restart(); running = true; }
      if (a.dataset.a === 'rec') {
        if (!HBX.canRecord()) { c.status('Ce navigateur ne sait pas filmer une page : utilise l\'enregistrement d\'écran du téléphone.'); HBH.err('Vidéo : MediaRecorder ou captureStream absent'); label(); return; }
        rec = true; document.body.classList.add('rec'); soundOn = false; countdown = Math.max(0.01, HBX.studio.cd); if (HBM.curves && !HBM.playing) HBM.play(); restart(); resize(); }
      label();
    });
    cv.addEventListener('click', () => { if (!rec) return; stopFilm(); });

    // menu card with a still picture of the game
    const card = document.createElement('button'); card.className = 'game'; card.type = 'button'; card.dataset.game = def.id;
    card.innerHTML = '<canvas class="thumb" width="184" height="184"></canvas><div><span class="gname">' + def.name + '</span><span class="gdesc">' + def.desc + '</span><span class="go">Jouer</span></div>';
    const shelf = document.querySelector('.shelf'); shelf.insertBefore(card, shelf.querySelector('.soon'));
    try {
      const tc = { W: 92, H: 92, clear: true, thumb: true, slow: false, opt: {}, note() {}, status() {}, scale }, tg = card.querySelector('canvas').getContext('2d');
      def.reset(tc); for (let i = 0; i < (def.thumbSteps || 200); i++) def.step(tc, 1 / 60);
      tg.setTransform(2, 0, 0, 2, 0, 0); tg.fillStyle = BG; tg.fillRect(0, 0, 92, 92); def.draw(tc, tg);
    } catch (e) {}

    if (def.setup) def.setup(view, c, restart);
    HBM.attach(view); HBT.attach(view); HBV.attach(view); HBC.attach(view, def.id); HBS.attach(view, def.id);
    window.addEventListener('hb-look', resize);
    window.HypnoGames[def.id] = {
      enter() { active = true; entered = performance.now(); resize(); restart(); running = true; label(); last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
      leave() { active = false; running = false; cancelAnimationFrame(raf); if (rec) stopFilm(); label(); if (HBM.playing) HBM.pause(); HBH.time(def.name, (performance.now() - entered) / 1000); if (def.leave) try { def.leave(c); } catch (e) {} }
    };
    window['__hb_' + def.id] = { c, def };
  }
  const FIX = 1 / 60, MAXN = 8;
  // how many fixed steps to run for this frame; the remainder is kept for the next frame
  function fixedSteps(c, t) { c.acc = (c.acc || 0) + t; let n = Math.floor(c.acc / FIX + 1e-9); c.acc -= n * FIX; if (n > MAXN) { n = MAXN; c.acc = 0; } return n; }
  return { game, scale, BG, setMelody, FIX, fixedSteps, get melody() { return melody; } };
})();

<script>
/* App shell: one view per game. A game registers { enter, leave } in window.HypnoGames under its id,
   owns the element #view-<id>, and gets a card in the home menu with data-game="<id>". */
(() => {
  const home = document.getElementById('home'), games = window.HypnoGames;
  let current = null;
  function show(id) {
    if (!games[id]) id = null;
    if (id === current) return;
    if (current) { games[current].leave(); document.getElementById('view-' + current).hidden = true; }
    current = id; home.hidden = !!id;
    if (id) { document.getElementById('view-' + id).hidden = false; games[id].enter(); }
    try { const want = id || 'jeux'; if (location.hash.slice(1) !== want) location.hash = want; } catch (e) {}
  }
  document.addEventListener('click', e => {
    const card = e.target.closest('[data-game]'); if (card) return show(card.dataset.game);
    if (e.target.closest('[data-home]')) show(null);
  });
  document.getElementById('hist-btn').addEventListener('click', () => HBH.open());
  const cap = document.getElementById('caption'); cap.value = HBX.caption;
  cap.addEventListener('input', () => HBX.setCaption(cap.value));
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
