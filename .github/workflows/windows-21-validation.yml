name: Windows 0.8.1 validation
on:
  push:
    branches: [ios/experience-beta]
    paths: ['work/desktop-app/**', 'work/experience-integration/**', '.github/workflows/windows-21-validation.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm install --global pnpm@11.25.0
      - run: python -m pip install Pillow
      - name: Build and verify Windows package
        shell: pwsh
        run: ./work/desktop-app/scripts/release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-22-verified
          path: |
            outputs/application-windows/
            outputs/application-windows-0.8.1/update-assets/
          if-no-files-found: error
          retention-days: 7
