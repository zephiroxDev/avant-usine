name: V26.0.2 — publication de Windows 0.11.1
on:
  push:
    branches: [main]
    paths: ['.github/v26-0-2-release.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v26-0-2-promotion
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish exact verified Windows packages and update assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/promote-v26-0-2.py windows
