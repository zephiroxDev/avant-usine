name: Publish exact verified iPhone experience
on:
  push:
    branches: [main]
    paths: ['work/experience-ios/verified-release.json']
  workflow_run:
    workflows: ['iPhone 2.2.0 — validation']
    types: [completed]
    branches: [ios/experience-beta]
permissions:
  contents: write
  actions: read
concurrency:
  group: ios-promote-experience
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'f3c8e2f67e533f1e53635444d0539ab9600b664d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Promote exact verified IPA without rebuilding
        working-directory: work/experience-ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/promote-experience.py
